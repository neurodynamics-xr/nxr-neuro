# THE 1-FORM PARTS OF A STORED HODGE-DIRAC PACKAGE, added without solving again. The eigensolve (`run eigenmodes`) stores each mode's 1-form part `<stem>_forms1` with the package; a package solved before
# that stored none, and every reading of it rebuilt the parts at each use. This runs the node `operators.hodge_one_form_parts` (the recipe `signal::oneFormParts`: dpsi/(mu sqrt2) for an exact mode,
# *1^-1 d1^T *2 chi/(mu sqrt2) for a coexact one) on the package's stored 0- and 2-form parts and its intrinsic complex, and stores the operator with the same name and cells the solve gives it:
#   <package>_forms1            operator, mode axis (cell 0) -> the complex's edges (cell 1) [nE x K], float32, one mode a chunk
# The numbers are the solve's own to float precision (the solve makes them from the same parts). What it cannot resolve: nothing of its own; it is the package's 1-forms, on the mesh and the solve's resolution.
#
#   nxr-neuro run hodgeforms1 --dataset <folder> --subject sub-01 --surface cortex_pial_glued [--package hodgeDirac__cortex_pial_glued] [--modes K] [--replace]
pipeline: hodgeforms1
version: 1
description: the 1-form parts of a stored Hodge-Dirac package's modes on its intrinsic complex's edges, made without solving again
scope: subject

inputs:
  package: {operator: eigenvectors, where: {name: "${package}_eigenvectors"}, hint: "a Hodge-Dirac package (`nxr-neuro run eigenmodes` first)"}
  complex: {manifold: surface, where: {name: "${surface}_intrinsic"}, hint: "the package's intrinsic complex: name the surface it was solved on (--surface)"}

parameters:
  package: {default: hodgeDirac, meaning: "the Hodge-Dirac package's stem (its eigenvectors are <package>_eigenvectors)", unit: "-"}
  surface: {default: null, meaning: "the surface the package was solved on, by name (its complex is <surface>_intrinsic)", unit: "-"}
  modes: {default: null, meaning: "the first K modes of the package; null: all", unit: "-"}
  name: {default: "{package}_forms1", meaning: "the stored operator's name", unit: "-"}

steps:
  before:
    - {node: operators.hodge_one_form_parts, in: {package: package}, with: {modes: $modes}, out: forms1}

outputs:
  forms1: {kind: operator, operator_kind: eigenvectors, name: $name, from: package.from, to: complex}
