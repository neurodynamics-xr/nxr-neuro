# THE PRODUCT OF KERNEL SETS: every combination of the members of two or three stored kernel sets (`select_kernels`), coded mixed radix with the FIRST
# factor fastest (the node `select.product`, layout product). The flow pipelines measure over such products: the atoms x the eigenvalue bands (the
# consistency per atom and band) and the atoms x the bands x the bands (the band pairs: frequency member a, band p at the tail, band q at the tip; code
# a + A (p Q + q)). A kernel set is a selection on its line (the frequency line, the eigenvalue line), so the product lies on the product of the lines.
#
#   nxr-neuro run select_kernel_product --dataset <folder> --subject sub-01 --first atoms --second bands --third bands --name "atoms x bands x bands"
pipeline: select_kernel_product
version: 1
description: the product of two or three stored kernel sets, mixed radix with the first factor fastest (the members a flow measurement is over)
scope: subject

inputs:
  first:  {selection: any, where: {name: $first}, hint: "the first kernel set (it varies fastest): e.g. the atoms (`nxr-neuro run select_kernels` first)"}
  second: {selection: any, where: {name: $second}, hint: "the second kernel set: e.g. the eigenvalue bands"}
  third:  {selection: any, where: {name: $third}, when: {factors: 3}, hint: "the third kernel set (factors 3): e.g. the bands again, for band pairs"}

parameters:
  factors: {default: 2, meaning: "how many kernel sets the product has: 2 (first, second) or 3 (first, second, third: e.g. atoms x bands x bands)", unit: "-", choices: [2, 3]}
  first: {default: required, meaning: "the first kernel set's name (it varies fastest)", unit: "-"}
  second: {default: required, meaning: "the second kernel set's name", unit: "-"}
  third: {default: null, meaning: "the third kernel set's name (factors 3)", unit: "-"}
  name: {default: required, meaning: "the product's name", unit: "-"}

steps:
  before:
    - {node: select.product, in: {first: first, second: second}, with: {layout: product}, out: [product_lines, product], when: {factors: 2}}
    - {node: select.product, in: {first: first, second: second, third: third}, with: {layout: product}, out: [product_lines_3, product_3], when: {factors: 3}}

outputs:
  product_lines: {kind: manifold, type: product, factors: [first.manifold.0, second.manifold.0], when: {factors: 2}}
  product_lines_3: {kind: manifold, type: product, factors: [first.manifold.0, second.manifold.0, third.manifold.0], when: {factors: 3}}
  product: {kind: selection, type: product, name: $name, on: product_lines, factors: [first, second], when: {factors: 2}}
  product_3: {kind: selection, type: product, name: $name, on: product_lines_3, factors: [first, second, third], when: {factors: 3}}
