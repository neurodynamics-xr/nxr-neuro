# THE VORTEX CORES' THRESHOLD, pass one (spec docs/specs/2026-11-14-vortex-cores-port.md, piece 5; docs/specs/2026-11-14-spatial-events.md, decision 5): the distribution of |hatted curl| over the burst frames, stored as a STATISTIC
# (counts in 4096 log bins, nxr `_core_threshold`); its percentile (98 by default) is derived at read by the cores' pass (`run vortex_cores`), which reads this statistic BY NAME.
#
# THE CHAIN (one linear map before any non-linear step, D106): the recording's analytic signal in the band (Morlet) → `frames` (the frame tiling, `run select_time_grid` rule frames: 36 frames to a cycle of the band's centre) with `within` the named bursts → `apply_kernel` (form curl_tan, the spatial level's Mexican hat on the GLUED surface: one cortex, the bridge filled by the hat; `eigen solve` stores the glue; linear, so it commutes with the frame sampling and runs on the frames, in blocks: `--block-frames`) → `core_histogram`: the good frames
# are the burst frames (and not the bad segments'). The histogram's range is fixed from the run's first 3000 good frames, counted from its first, so it does not depend on the chunk size.
#
# The bursts and the frame tiling are named by the caller (`bursts`, `tiling`: stored nodes read by name; `{recording}` is the recording's name). A cut of the run (`--from`/`--to`) cuts the distribution.
#
#   nxr-neuro run select_time_grid --dataset <folder> --subject sub-01 --recording rest
#   nxr-neuro run vortex_core_threshold --dataset <folder> --subject sub-01 --spatial-scale "parts 32" --band "8-12 Hz" --all
pipeline: vortex_core_threshold
version: 2
description: the distribution of |hatted curl| over the burst frames (4096 log bins), a statistic from which the cores' threshold is read
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  kernel:    {operator: inverse kernel, from: recording.manifold.0, where: {name: $kernel, params.inverse.measure: $method}}
  tiles:     {selection: ladder, manifold: kernel.to, where: {name: "{surface} tiles"}, hint: "the surface's grid (`nxr-neuro run select_dyadic_surface` first)"}
  glued:     {manifold: surface, where: {name: $glued_surface}, hint: "the glued cortex (`nxr-neuro run glue` first): the computational manifold for spatiotemporal patterns"}
  grid:      {selection: any, manifold: recording.time, where: {name: "{recording} time grid frames ${band} ${frames_per_cycle} per cycle"}, hint: "the band's frame grid (`nxr-neuro run select_time_grid --rule frames --band 8-12Hz` first)"}
  bursts:    {selection: spans, manifold: recording.time, where: {name: $bursts}}
  bad:       {selection: spans, manifold: recording.time, where: {name: "{recording}_bad_segments"}, required: false}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  kernel: {default: none, meaning: "the inverse kernel's name, or none: found by `method` (the named kernel must also be of that method: --method)", unit: "-"}
  band: {default: "8-12 Hz", meaning: "the band as a quantity (Hz): the band the curl is of", unit: "Hz"}
  shape: {default: morlet, meaning: "the temporal band's shape: morlet (the project's fixed-band rule) | meyer", unit: "-"}
  spatial_shape: {default: mexhat, meaning: "the spatial level's gain: mexhat (the level is the Mexican hat) | meyer (the level IS its Weyl band)", unit: "-"}
  spatial_scale: {default: "parts 32", meaning: "the spatial band as a quantity: a tile diameter, a wavelength, an eigenvalue, parts per hemisphere or a named scale; its Weyl band is the spatial band", unit: mm, chart: wavelength}
  glued_surface: {default: null, meaning: "the glued cortex made by `run glue`, by name; results are restricted back to the original hemispheres", unit: "-"}
  method: {default: MNE, meaning: "the kernel's inverse method (its params.inverse.measure)", unit: "-"}
  transform: {default: auto, meaning: "the spatial band's transform: auto (eigenmodes first, Chebyshev an announced fallback) | eigen | chebyshev | exact", unit: "-"}
  modes: {default: 0, meaning: "when the eigenmodes are computed: the package's size; 0: the standard 3000, or more when the level needs it", unit: "modes"}
  order: {default: 0, meaning: "chebyshev degree; 0: the smallest of 40 to 5120 within `tolerance` of the band's gain", unit: "degree"}
  tolerance: {default: 0.01, meaning: "the largest difference between the band's gain and the chebyshev series that is accepted", unit: "fraction"}
  frames_per_cycle: {default: 36, meaning: "the frame density: frames to one cycle of the band's centre (the 10 degree step of phase work); the frame is the dyadic tile nearest it", unit: frames/cycle}
  frames_per_tile: {default: null, meaning: "the frame density per tile of the band instead (a power of two); wins over frames_per_cycle when given", unit: frames/tile}
  origin: {default: start, meaning: "the frames' origin as a point: start (the recording's first sample) | clock | event (a stored selection's first member)", unit: "-", choices: [start, clock, event]}
  bursts: {default: "global_bursts.bursts.{recording}", meaning: "the spans Selection the frames are inside (the kept bursts of `run global_bursts`, or any spans: a stage)", unit: "-"}
  bad_segments: {default: exclude, meaning: "exclude | ignore the recording's bad spans", unit: "-"}
  bins: {default: 4096, meaning: "nxr `_core_threshold`", unit: "bins"}
  range_frames: {default: 3000, meaning: "the first good frames that fix the bins' range (nxr's chunk of 3000)", unit: "frames"}
  block_frames: {default: 256, meaning: "the frames binned at once (memory only: the result does not depend on it)", unit: "frames"}

steps:
  chunks:
    over: recording
    do:
      - {node: signal.analytic, in: {x: recording}, with: {band: $band, shape: $shape}, out: z}
      - {node: signal.frames, in: {x: z, tiling: grid, within: bursts}, with: {band: $band, frames_per_cycle: $frames_per_cycle, frames_per_tile: $frames_per_tile, origin: $origin}, out: z_frames}
      - {node: meeg.apply_kernel, in: {x: z_frames, kernel: kernel, tiles: tiles, glued: glued}, with: {spatial_scale: $spatial_scale, transform: $transform, modes: $modes, order: $order, tolerance: $tolerance, spatial_shape: $spatial_shape, form: curl_tan}, out: curl_frames}
      - {node: measurement.estimate, in: {x: curl_frames, exclude: bad}, with: {method: histogram, bins: $bins, range_frames: $range_frames, block_frames: $block_frames, bad_segments: $bad_segments}, out: histogram}

outputs:
  histogram: {kind: statistic}
