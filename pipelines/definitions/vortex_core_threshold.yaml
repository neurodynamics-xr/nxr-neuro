# THE VORTEX CORES' THRESHOLD, pass one (spec docs/specs/2026-11-14-vortex-cores-port.md, piece 5; docs/specs/2026-11-14-spatial-events.md, decision 5): the distribution of |hatted curl| over the burst frames, stored as a STATISTIC
# (counts in 4096 log bins, nxr `_core_threshold`); its percentile (98 by default) is derived at read by the cores' pass (`run vortex_cores`), which reads this statistic BY NAME.
#
# THE CHAIN (one linear map before any non-linear step, D106): the recording's analytic signal in the band (Morlet) → `frames` (the frame tiling, `run frametiling`: 36 frames to a cycle of the band's centre) with `within` the named bursts → `apply_kernel` (form curl_tan, the spatial level's Mexican hat on the GLUED surface: one cortex, the bridge filled by the hat; `eigen solve` stores the glue; linear, so it commutes with the frame sampling and runs on the frames, in blocks: `--block-frames`) → `core_histogram`: the good frames
# are the burst frames (and not the bad segments'). The histogram's range is fixed from the run's first 3000 good frames, counted from its first, so it does not depend on the chunk size.
#
# The bursts and the frame tiling are named by the caller (`bursts`, `tiling`: stored nodes read by name; `{recording}` is the recording's name). A cut of the run (`--from`/`--to`) cuts the distribution.
#
#   nxr-neuro run frametiling  --dataset <folder> --subject sub-01 --recording rest --band 8,12
#   nxr-neuro run vortex_core_threshold --dataset <folder> --subject sub-01 --space-level 5 --band '[8.0,12.0]' --all
pipeline: vortex_core_threshold
version: 1
description: the distribution of |hatted curl| over the burst frames (4096 log bins), a statistic from which the cores' threshold is read
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  kernel:    {operator: inverse kernel, from: recording.manifold.0, where: {name: $kernel, params.inverse.measure: $method}}
  tiles:     {selection: ladder, manifold: kernel.to}
  tiling:    {selection: spans, manifold: recording.time, where: {name: $tiling}}
  bursts:    {selection: spans, manifold: recording.time, where: {name: $bursts}}
  bad:       {selection: spans, manifold: recording.time, where: {name: "{recording}_bad_segments"}, required: false}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  kernel: {default: none, meaning: "the inverse kernel's name, or none: found by `method` (the named kernel must also be of that method: --method)", unit: "-"}
  band: {default: [8.0, 12.0], meaning: "Hz: the band the curl is of", unit: "Hz"}
  shape: {default: morlet, meaning: "the temporal band's shape: morlet (the project's fixed-band rule) | meyer", unit: "-"}
  spatial_shape: {default: mexhat, meaning: "the spatial level's gain: mexhat (the level is the Mexican hat) | meyer (the level IS its Weyl band)", unit: "-"}
  space_level: {default: 5, meaning: "the surface ladder's level: its hat is the spatial band", unit: "level"}
  method: {default: MNE, meaning: "the kernel's inverse method (its params.inverse.measure)", unit: "-"}
  transform: {default: auto, meaning: "the spatial band's transform: auto (eigenmodes first, Chebyshev an announced fallback) | eigen | chebyshev | exact", unit: "-"}
  modes: {default: 0, meaning: "when the eigenmodes are computed: the package's size; 0: the standard 3000, or more when the level needs it", unit: "modes"}
  order: {default: 0, meaning: "chebyshev degree; 0: the smallest of 40 to 5120 within `tolerance` of the band's gain", unit: "degree"}
  tolerance: {default: 0.01, meaning: "the largest difference between the band's gain and the chebyshev series that is accepted", unit: "fraction"}
  tiling: {default: "{recording} frames 0.00257492 s", meaning: "the frame tiling's name (`run frametiling`): `<recording> frames <frame_s> s`: level -25 = 2.57 ms, what `run frametiling --band 8,12` derives (36 frames to a cycle of 10 Hz); another band or level: name it here", unit: "-"}
  bursts: {default: "global_bursts.bursts_kept.{recording}", meaning: "the spans Selection the frames are inside (the kept bursts of `run global_bursts`, or any spans: a stage)", unit: "-"}
  bad_segments: {default: exclude, meaning: "exclude | ignore the recording's bad spans", unit: "-"}
  bins: {default: 4096, meaning: "nxr `_core_threshold`", unit: "bins"}
  range_frames: {default: 3000, meaning: "the first good frames that fix the bins' range (nxr's chunk of 3000)", unit: "frames"}
  block_frames: {default: 256, meaning: "the frames binned at once (memory only: the result does not depend on it)", unit: "frames"}

steps:
  chunks:
    over: recording
    do:
      - {step: analytic, in: {x: recording}, with: {band: $band, shape: $shape}, out: z}
      - {step: frames, in: {x: z, tiling: tiling, within: bursts}, out: z_frames}
      - {step: apply_kernel, in: {x: z_frames, kernel: kernel, tiles: tiles}, with: {level: $space_level, transform: $transform, modes: $modes, order: $order, tolerance: $tolerance, spatial_shape: $spatial_shape, form: curl_tan}, out: curl_frames}
      - {step: core_histogram, in: {x: curl_frames, exclude: bad}, with: {bins: $bins, range_frames: $range_frames, block_frames: $block_frames, bad_segments: $bad_segments}, out: histogram}

outputs:
  histogram: {kind: statistic}
