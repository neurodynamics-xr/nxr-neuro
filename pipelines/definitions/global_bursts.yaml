# THE GLOBAL BURSTS of a band: WHEN the cortex is in one, and WHERE (spec docs/specs/2026-11-13-cortical-events.md; the chain of docs/specs/2026-11-17-consolidation.md section 9.1). THE GRAPH:
#   recording -- the field chain `cortical_band` (composed: the band read on the cortex through the kernel, the SPATIAL band folded in, |z| per vertex) -->
#   reduce {over: the coupled product (spatial tiles at the spatial scale x time tiles of the band), made by `select_product`}: amplitude and envelope_max per CELL -- roll_up {to: whole | pieces}
#   --> the TRACE (the largest |z| per time tile: envelope_max merges by max, over the whole brain or each connected piece) -- summarize --> the baseline -- select.events.spans (Rheome's 1.5 / 1.0 SD)
#   --> the global bursts (an irregular selection detected over the time grid; no channel) -- select.events.regions (the bursts' space x time EXTENT on the cells) -- reduce.members -- summarize.
# Parameters are QUANTITIES: the band (Hz), the spatial scale (a tile diameter, a wavelength or a named scale: its level is resolved in closed form and recorded with the snapped quantity), the
# filters of the bursts (a gap to join and a duration range, in seconds or in cycles of the band's centre: "0.1 s", ">=3 cycles"), the extents' area (mm2).
# The cortex is the caller's choice (rule 19): the kernel's surface (the two-hemisphere surface of record) or the glued surface made by `run glue` (the default computational manifold for
# spatiotemporal patterns, rule 33); the bursts and extents are reported on the original hemispheres.
#
# SEVERAL (band x spatial scale) pairs: `--band` and `--spatial-scale` take LISTS; the runner makes one plan per pair, each cached on its own (this replaces `cortical_event_pairs`).
# THE EDGES ON SAMPLES (Rheome's rise and fall fit): the per-SAMPLE series of each burst's trace is the largest tile mean per sample, a measurement over the product of the spatial tiles and the one-sample time grid
# (`select_product` with the time grid of 4 ms tiles at 250 Hz, the line's samples), rolled over space with `merge: max` (the largest of the members' own values); `select.risefall` fits each burst on it, the fit gate
# keeps the bursts that fit well (`bursts_kept`: r2 >= gate_min_r2 and no time at its bound), and the stages (onset, within, offset) come from the stored fits. MEMORY: the sample product's cells, tiles x samples of the span.
# WHERE: each burst's space x time EXTENT on the cells of its own time tiles; each cell's amplitude standardised against its spatial tile's baseline over the run's time tiles; hysteresis regions
# (`extent_enter_sd` / `extent_exit_sd`) on the graph of touching tiles within a time tile and a tile with itself in the next; every region an EVENT linked to its burst, its measures by the exact
# roll-up of its cells (area, amplitude, peak, first and last tile, duration, path length of the centres), with their statistics across the events.
#
#   nxr-neuro run select_dyadic_surface --dataset <folder> --subject sub-01 --surface cortex --finest "20 mm"
#   nxr-neuro run select_time_grid      --dataset <folder> --subject sub-01 --recording rest
#   nxr-neuro run global_bursts --dataset <folder> --subject sub-01 --spatial-scale "wavelength 40 mm" --band "8-16 Hz" --all [--groups pieces --combine each]
pipeline: global_bursts
version: 2
description: the global bursts of a band from the cortex (the largest |z| over the spatial tiles per time tile) and the extents of each burst on the cells
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  bursts_field: {field: source estimate, chain: cortical_band, chain_parameters: {recording: "{recording}", kernel: $kernel, method: $method, band: $band, shape: $shape, spatial_scale: $spatial_scale, spatial_shape: $spatial_shape, transform: $transform, envelope: $envelope, modes: $modes, order: $order, tolerance: $tolerance}, hint: "composed in: the band on the cortex (the chain `cortical_band`)"}
  product:   {selection: any, where: {name: $product}, hint: "the product of the spatial tiles at the spatial scale and the time tiles of the band (`nxr-neuro run select_product` first)"}
  sample_product: {selection: any, where: {name: $sample_product}, hint: "the product of the spatial tiles and the line's one-sample time grid (`nxr-neuro run select_product` with the grid made by `select_time_grid --rule tiles --duration <one sample>`)"}
  grid:      {selection: any, manifold: recording.time, where: {name: "{recording} time grid band ${band}"}, hint: "the band's time grid (`nxr-neuro run select_time_grid --rule band --band 8-16Hz` first)"}
  bad:       {selection: spans, manifold: recording.time, where: {name: "{recording}_bad_segments"}, required: false}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  kernel: {default: none, meaning: "the inverse kernel's name, or none: found by `method` (the named kernel must also be of that method: --method)", unit: "-"}
  method: {default: MNE, meaning: "the kernel's inverse method (its params.inverse.measure)", unit: "-"}
  surface: {default: null, meaning: "the cortex the kernel maps onto, by name (the surface of record or the glued surface)", unit: "-"}
  sample_product: {default: null, meaning: "the product of the spatial tiles and the one-sample time grid, by name: the per-sample series the bursts' edges are fitted on", unit: "-"}
  product: {default: null, meaning: "the product selection (spatial tiles x time tiles) the cells are, by name", unit: "-"}
  band: {default: "8-16 Hz", meaning: "the band as a quantity (its time level is resolved from it)", unit: Hz, chart: linear}
  shape: {default: morlet, meaning: "the temporal band's shape: morlet | meyer (compact edges: bands that add up)", unit: "-"}
  spatial_shape: {default: mexhat, meaning: "the spatial band's gain: mexhat | meyer (the scale IS its Weyl band: compact edges)", unit: "-"}
  spatial_scale: {default: null, meaning: "the spatial band as a quantity: a tile diameter (20 mm), a wavelength (wavelength 40 mm), an eigenvalue or a named scale; its Weyl band is the spatial band, its tiles the spatial partition", unit: mm, chart: wavelength}
  groups: {default: whole, meaning: "whole | pieces: the max over all the spatial tiles, or over each connected piece's (a hemisphere: the roll-up's target); pieces needs `combine: each`", unit: "-", choices: [whole, pieces]}
  combine: {default: mean, meaning: "the detection's series: mean (one global trace: GLOBAL events, no row) | each (a trace a group: with per_hemisphere, each event carries its hemisphere); per_hemisphere needs `each`", unit: "-"}
  transform: {default: auto, meaning: "the spatial band's route: auto = the stored eigenmodes when they reach the scale's band, else computed and stored (said), else chebyshev (announced) | eigen | chebyshev | exact (dense, at most 4096 vertices)", unit: "-"}
  envelope: {default: temporal, meaning: "the spatial amplitude: temporal = |z| of the band-passed field | spatiotemporal = the monogenic amplitude (another recipe: a rerun of the other envelope needs --replace)", unit: "-"}
  modes: {default: 0, meaning: "when the eigenmodes are computed: the package's size; 0: the standard 3000, or more when the scale needs it", unit: modes}
  order: {default: 0, meaning: "chebyshev degree; 0: the smallest of 40 to 5120 within `tolerance` of the band's gain", unit: degree}
  tolerance: {default: 0.01, meaning: "the largest difference between the band's gain and the chebyshev series that is accepted", unit: fraction}
  bad_segments: {default: exclude, meaning: "exclude | ignore the recording's bad spans", unit: "-"}
  enter_sd: {default: 1.5, meaning: "Rheome's labelalpha (as band_bursts)", unit: "robust SD"}
  exit_sd: {default: 1.0, meaning: "robust SDs above the median to extend a burst (Rheome's loSD)", unit: "robust SD"}
  merge_s: {default: 0.1, meaning: "gaps up to this are joined (Rheome's labelalpha, the default); with durations cycles, merge_cycles is used instead", unit: s, chart: clock}
  merge_cycles: {default: 1.0, meaning: "durations cycles: gaps up to this many cycles of the band's centre are joined (the nxr spindle_envelope)", unit: cycles}
  min_s: {default: 0.4, meaning: "the bursts kept are at least this long", unit: s, chart: clock}
  max_s: {default: null, meaning: "the bursts kept are at most this long; null: no upper bound", unit: s, chart: clock}
  min_cycles: {default: 3.0, meaning: "durations cycles: the bursts kept are at least this many cycles of the band's centre", unit: cycles}
  max_cycles: {default: null, meaning: "durations cycles: at most this many cycles; null: no upper bound", unit: cycles}
  durations: {default: seconds, meaning: "seconds (merge_s, min_s, max_s) | cycles (merge_cycles, min_cycles, max_cycles, of the band's centre)", unit: "-", choices: [seconds, cycles]}
  burst_summaries: {default: [count, sum, median, mean, sd, "percentile:25", "percentile:75", "percentile:90"], meaning: "the statistics across the bursts, per measurement", unit: "-"}
  extent_enter_sd: {default: 1.5, meaning: "the extent's hysteresis on z = (cell amplitude - the tile's median) / the tile's robust SD (as the bursts')", unit: "robust SD"}
  extent_exit_sd: {default: 1.0, meaning: "the extent's lower hysteresis threshold", unit: "robust SD"}
  model: {default: linear, meaning: "risefall: linear | quadrature (the posterior model is not built)", unit: "-"}
  margin: {default: 1.0, meaning: "risefall: seconds either side of a burst included in its fit", unit: s, chart: clock}
  smooth: {default: 0.1, meaning: "risefall: the symmetric moving mean applied first", unit: s, chart: clock}
  tau_max: {default: 1.0, meaning: "risefall: the bound of the rise and fall times", unit: s, chart: clock}
  min_r2: {default: null, meaning: "risefall: a fit below it is set NaN; null keeps every fit (the caller filters on fit_r2)", unit: "-"}
  margin_cycles: {default: 10.0, meaning: "durations cycles: risefall's margin in cycles of the band's centre (nxr burst_stages)", unit: cycles}
  smooth_cycles: {default: 1.0, meaning: "durations cycles: risefall's smoothing in cycles", unit: cycles}
  tau_max_cycles: {default: 10.0, meaning: "durations cycles: the bound of the rise and fall times in cycles", unit: cycles}
  gate_min_r2: {default: 0.7, meaning: "the fit gate (nxr burst_stages, labelalpha's): a burst is kept when its fit has r2 at least this and neither time at its bound", unit: "-"}
  min_area: {default: 0.0, meaning: "an event's cells' tiles cover at least this area (m2); 0: none", unit: m2}

steps:
  chunks:
    over: recording
    do:
      # the cells: amplitude and the largest |z| per (spatial tile x time tile), the product coupled to the band and the spatial scale
      - {node: signal.field_form, in: {x: bursts_field}, with: {form: magnitude}, out: mag}
      - {node: measurement.reduce, in: {x: mag, over: product, exclude: bad}, with: {measures: [amplitude, envelope_max], bad_segments: $bad_segments}, out: [cells, cells_ingredients]}
      # the per-sample cells: the mean |z| of each spatial tile at each sample
      - {node: measurement.reduce, in: {x: mag, over: sample_product, exclude: bad}, with: {measures: [amplitude], bad_segments: $bad_segments}, out: [sample_cells, sample_cells_ingredients]}
  after:
    - {node: measurement.roll_up, in: {x: cells_ingredients}, with: {to: $groups, measures: [envelope_max]}, out: [trace_cells, trace_cells_ingredients]}
    - {node: measurement.summarize, in: {x: trace_cells}, with: {summaries: [median, mad], combine: $combine}, out: baseline}
    - {node: select.events.spans, in: {x: trace_cells, baseline: baseline}, with: {rule: detect, combine: $combine, enter_sd: $enter_sd, exit_sd: $exit_sd, merge_s: $merge_s, min_s: $min_s, max_s: $max_s, durations: $durations, merge_cycles: $merge_cycles, min_cycles: $min_cycles, max_cycles: $max_cycles}, out: bursts}
    # the series the edges are fitted on: the largest tile mean per sample (merge max), then Rheome's rise and fall fit, the fit gate and the stages
    - {node: measurement.roll_up, in: {x: sample_cells_ingredients}, with: {to: $groups, measures: [amplitude], merge: max}, out: [samples, samples_ingredients]}
    - {node: select.risefall, in: {x: samples, events: bursts}, with: {model: $model, margin: $margin, smooth: $smooth, tau_max: $tau_max, min_r2: $min_r2, durations: $durations, margin_cycles: $margin_cycles, smooth_cycles: $smooth_cycles, tau_max_cycles: $tau_max_cycles}, out: [t_on, t_off, tau_rise, tau_fall, fit_baseline, fit_height, fit_r2, plateau_duration]}
    - {node: select.events.spans, in: {events: bursts, fit_r2: fit_r2}, with: {rule: keep_where, min_r2: $gate_min_r2}, out: bursts_kept}
    - {node: select.events.spans, in: {events: bursts, t_on: t_on, t_off: t_off, tau_rise: tau_rise, tau_fall: tau_fall, kept: bursts_kept}, with: {rule: stages}, out: [burst_onset, burst_within, burst_offset]}
    - {node: measurement.summarize, in: {x: tau_rise}, with: {summaries: $burst_summaries, combine: each}, out: tau_rise_stats}
    - {node: measurement.summarize, in: {x: tau_fall}, with: {summaries: $burst_summaries, combine: each}, out: tau_fall_stats}
    - {node: measurement.summarize, in: {x: fit_r2}, with: {summaries: $burst_summaries, combine: each}, out: fit_r2_stats}
    - {node: measurement.reduce_members, in: {x: trace_cells_ingredients, over: bursts}, with: {measures: [amplitude, envelope_max, duration, interval_next]}, out: [burst_values, burst_values_ingredients]}
    - {node: measurement.summarize, in: {x: burst_values}, with: {summaries: $burst_summaries, combine: each}, out: burst_stats}
    - {node: measurement.summarize, in: {x: cells},        with: {summaries: [median, mad], combine: each, measure: amplitude, by_factor: 0}, out: cell_baseline}
    # WHERE: the extents, regions of the cells standardised against their tile's baseline, within each burst
    - {node: select.events.regions, in: {x: cells, baseline: cell_baseline, events: bursts}, with: {enter_sd: $extent_enter_sd, exit_sd: $extent_exit_sd, min_area: $min_area}, out: extents}
    - {node: measurement.reduce_members, in: {x: cells_ingredients, over: extents}, with: {measures: [n_cells, n_tiles, area, amplitude, envelope_max, first_cell, last_cell, duration, path_length, centre]}, out: [extent_values, extent_values_ingredients]}
    - {node: measurement.summarize, in: {x: extent_values}, with: {summaries: $burst_summaries, combine: each}, out: extent_stats}

outputs:
  cells:            {kind: measurement, over: product, of: bursts_field}
  baseline:         {kind: statistic}
  bursts:           {kind: spans, types: [burst], detected_over: grid}
  bursts_kept:      {kind: spans, types: [burst], detected_over: grid}      # the bursts whose rise-fall fit passes the gate
  burst_onset:      {kind: spans, types: [burst onset], detected_over: grid}
  burst_within:     {kind: spans, types: [burst within], detected_over: grid}
  burst_offset:     {kind: spans, types: [burst offset], detected_over: grid}
  t_on:             {kind: measurement, over: bursts, of: bursts_field}
  t_off:            {kind: measurement, over: bursts, of: bursts_field}
  tau_rise:         {kind: measurement, over: bursts, of: bursts_field}
  tau_fall:         {kind: measurement, over: bursts, of: bursts_field}
  fit_baseline:     {kind: measurement, over: bursts, of: bursts_field}
  fit_height:       {kind: measurement, over: bursts, of: bursts_field}
  fit_r2:           {kind: measurement, over: bursts, of: bursts_field}
  plateau_duration: {kind: measurement, over: bursts, of: bursts_field}
  tau_rise_stats:   {kind: statistic, of: tau_rise}
  tau_fall_stats:   {kind: statistic, of: tau_fall}
  fit_r2_stats:     {kind: statistic, of: fit_r2}
  burst_values:     {kind: measurement, over: bursts, of: bursts_field}
  burst_stats:      {kind: statistic, of: burst_values}
  cell_baseline:    {kind: statistic}
  extents:          {kind: labelling}       # a set on the cells (the product's members, the spatial tile fastest): each event a member described by its centre and extent, linked to its burst
  extent_values:    {kind: measurement, over: extents, of: bursts_field}
  extent_stats:     {kind: statistic, of: extent_values}
