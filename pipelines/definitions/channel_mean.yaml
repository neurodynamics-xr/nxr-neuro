# EACH CHANNEL'S MEAN OVER A SPAN (a statistic): the first pass of a FIR filter that removes the record's mean (Brainstorm's), read one chunk at a time.
#
#   nxr-neuro run channel_mean --dataset <folder> --subject sub-01 --recording rest --all
pipeline: channel_mean
version: 1
description: each channel's mean over a span of a recording
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  name: {default: "{recording}_channel_mean", meaning: "the stored statistic's name", unit: "-"}

steps:
  chunks:
    over: recording
    do:
      - {node: filter.channel_mean, in: {x: recording}, out: mean}

outputs:
  mean:
    kind: statistic
    name: $name
    of: recording
    axes: [{name: channel, on: recording.manifold.0}]
