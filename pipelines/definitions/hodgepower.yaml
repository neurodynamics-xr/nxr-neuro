# THE BAND POWER OF THE HODGE-DIRAC MODES OF A RECORDING'S SOURCES (a statistic): the fused weights B [2K x channels] of a free kernel on a stored Hodge-Dirac package (each
# mode's normal-current coefficient a and flow coefficient b as linear maps of the channels; `nxr-neuro eigen solve` first), then the channels' cross-spectral density per band
# (Welch, streamed, the bad segments left out) read through B: power = diag(B S_b B^T). Rows 0..K are the modes' normal-current parts, rows K..2K their flow parts.
#
#   nxr-neuro run hodgepower --dataset <folder> --subject sub-01 --recording rest --all --kernel KERNEL [--package hodgeDirac] [--modes 200]
pipeline: hodgepower
# WHY WELCH: the Hodge power ports nxr's (the fused inverse on a Welch band power); it stays as the reference made it. The flow definitions read the chunk spectra.
version: 1
description: the band power of the Hodge-Dirac mode weights (normal-current and flow parts) of a recording's sources
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  kernel:    {operator: inverse kernel, from: recording.manifold.0, where: {name: $kernel}}
  package:   {operator: eigenvectors, where: {name: "${package}_eigenvectors"}, hint: "a Hodge-Dirac package of the kernel's surface (`nxr-neuro eigen solve` first)"}
  bad:       {selection: spans, manifold: recording.time, where: {name: "{recording}_bad_segments"}, required: false}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  kernel: {default: none, meaning: "the free-orientation inverse kernel's name, or none: the subject's one inverse kernel", unit: "-"}
  package: {default: hodgeDirac, meaning: "the Hodge-Dirac package's stem (its eigenvectors are <package>_eigenvectors)", unit: "-"}
  modes: {default: null, meaning: "the first K modes of the package; null: all", unit: "-"}
  name: {default: "{recording}_{kernel}_hodge", meaning: "the stored statistic's name; its segment partition is <name>_segments", unit: "-"}
  bands: {default: [{name: delta, lo: 2, hi: 4}, {name: theta, lo: 5, hi: 7}, {name: alpha, lo: 8, hi: 12}, {name: beta, lo: 15, hi: 29}, {name: gamma1, lo: 30, hi: 59}, {name: gamma2, lo: 60, hi: 90}], meaning: "the bands: {name, lo, hi}; a band holds the bins from lo to hi inclusive", unit: "Hz"}
  segment_seconds: {default: 4.0, meaning: "the segment's length in seconds (under segment_rule tile it snaps to the nearest 2^k samples)", unit: "s"}
  segment_samples: {default: null, meaning: "the segment's length in samples (wins over segment_seconds); null: from segment_seconds", unit: "samples"}
  segment_rule: {default: tile, meaning: "how the segment's length becomes samples: tile | round | even", unit: "-", choices: [tile, round, even]}
  overlap: {default: 0.5, meaning: "the fraction of a segment shared with the next, in [0, 1)", unit: "fraction"}
  window: {default: hamming, meaning: "the taper of each segment", unit: "-", choices: [hann, hamming, blackman, rectangular]}
  periodic: {default: false, meaning: "the DFT-even form of the window rather than the symmetric one", unit: "-"}
  detrend: {default: constant, meaning: "what is removed from each segment before windowing", unit: "-", choices: [none, constant, linear]}
  scaling: {default: density, meaning: "density = power per Hz | spectrum = power | chain = per sample, per bin", unit: "-", choices: [density, spectrum, chain]}
  bad_segments: {default: exclude, meaning: "exclude = a segment touching one of the recording's bad segments is left out | ignore = every segment is kept", unit: "-", choices: [exclude, ignore]}

presets:
  tiles:      {segment_rule: tile}
  brainstorm: {segment_rule: round, window: hamming, periodic: false, detrend: constant, scaling: density}

steps:
  before:
    - {node: operators.hodge_weights, in: {kernel: kernel, package: package}, with: {modes: $modes}, out: weights}
  chunks:
    over: recording
    do:
      - {node: meeg.source_band_power, in: {x: recording, kernel: weights, exclude: bad}, with: {bands: $bands, normalisation: none, row_axis: mode_part, segment_seconds: $segment_seconds, segment_samples: $segment_samples, segment_rule: $segment_rule, overlap: $overlap, window: $window, periodic: $periodic, detrend: $detrend, scaling: $scaling, bad_segments: $bad_segments}, out: power}

outputs:
  power:
    kind: statistic
    name: $name
    of: recording
    axes: [{name: mode_part, on: package.from, parts: [normal, flow]}, {name: band}]
    partition: {tiling: "$name_segments", on: recording.time}
