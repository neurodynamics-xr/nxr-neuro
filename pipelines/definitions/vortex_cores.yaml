# THE VORTEX CORES, pass two (spec docs/specs/2026-11-14-vortex-cores-port.md, piece 5; docs/specs/2026-11-14-spatial-events.md, decision 1): the connected patches where the hatted curl of the current is above its threshold,
# one sense each, in each burst frame (nxr `_core_patches`). The THRESHOLD is read BY NAME from the stored distribution `run vortex_core_threshold` made (`threshold_statistic`), and the percentile (98, nxr's) derived here from
# its counts: a core is cut from a threshold it is given.
#
# THE CHAIN is pass one's, to the frames: analytic (Morlet) → frames (inside the named bursts: the sensors' band signal sampled on the tiling) → apply_kernel (form curl_tan, the Mexican hat of the level, on the GLUED surface: linear, so it commutes with the frame sampling) → cores. The kernel runs on the frames only, in blocks of frames (`--block-frames`). The step refuses a threshold made from
# another band, level, shape, form or frame tiling.
#
# STORED as POINT EVENTS (point_events.h): a spans Selection `vortex_cores.cores.<recording>` of type `core`, ONE MEMBER PER CORE whose span is the core's frame (members may share a frame: in the order frame, sense +1 first,
# lowest vertex), and per core as measurements over that Selection: frame, sense, centre_vertex (a vertex of the glued surface), centre (centre_x, centre_y, centre_z: the |curl|·area-weighted centroid, the surface's unit, m),
# area (m²) and peak (the largest sense · curl). Frames are independent: the result does not depend on the chunk size. The cores are DESCRIPTIONS of where the field rotates, not evidence that it does (the lag-free null is, piece 10).
#
#   nxr-neuro run vortex_core_threshold --dataset <folder> --subject sub-01 --spatial-scale "parts 32" --all
#   nxr-neuro run vortex_cores          --dataset <folder> --subject sub-01 --spatial-scale "parts 32" --all
pipeline: vortex_cores
version: 2
description: the vortex cores of a band's hatted curl over the burst frames, from the stored threshold, stored as point events
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  kernel:    {operator: inverse kernel, from: recording.manifold.0, where: {name: $kernel, params.inverse.measure: $method}}
  tiles:     {selection: ladder, manifold: kernel.to, hint: "the surface's grid (`nxr-neuro run select_dyadic_surface` first)"}
  glued:     {manifold: surface, where: {name: $glued_surface}, hint: "the glued cortex (`nxr-neuro run glue` first): the computational manifold for spatiotemporal patterns"}
  grid:      {selection: any, manifold: recording.time, where: {name: "{recording} time grid frames ${band} ${frames_per_cycle} per cycle"}, hint: "the band's frame grid (`nxr-neuro run select_time_grid --rule frames --band 8-12Hz` first)"}
  bursts:    {selection: spans, manifold: recording.time, where: {name: $bursts}}
  threshold: {statistic: histogram, where: {name: $threshold_statistic}}
  bad:       {selection: spans, manifold: recording.time, where: {name: "{recording}_bad_segments"}, required: false}
  onset:     {selection: spans, manifold: recording.time, where: {name: $onset}, required: false}
  within:    {selection: spans, manifold: recording.time, where: {name: $within}, required: false}
  offset:    {selection: spans, manifold: recording.time, where: {name: $offset}, required: false}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  kernel: {default: none, meaning: "the inverse kernel's name, or none: found by `method` (the named kernel must also be of that method: --method)", unit: "-"}
  band: {default: "8-12 Hz", meaning: "the temporal band as a quantity (the frames and the time grid are resolved from it)", unit: Hz, chart: linear}
  shape: {default: morlet, meaning: "the temporal band's shape: morlet | meyer", unit: "-"}
  spatial_shape: {default: mexhat, meaning: "the spatial level's gain: mexhat | meyer", unit: "-"}
  spatial_scale: {default: "parts 32", meaning: "the spatial band as a quantity: a tile diameter, a wavelength, an eigenvalue, parts per hemisphere or a named scale; its Weyl band is the spatial band", unit: mm, chart: wavelength}
  glued_surface: {default: null, meaning: "the glued cortex made by `run glue`, by name; results are restricted back to the original hemispheres", unit: "-"}
  method: {default: MNE, meaning: "the kernel's inverse method (its params.inverse.measure)", unit: "-"}
  transform: {default: auto, meaning: "the spatial band's transform: auto | eigen | chebyshev | exact", unit: "-"}
  modes: {default: 0, meaning: "when the eigenmodes are computed: the package's size; 0: the standard 3000, or more when the level needs it", unit: "modes"}
  order: {default: 0, meaning: "chebyshev degree; 0: the smallest of 40 to 5120 within `tolerance` of the band's gain", unit: "degree"}
  tolerance: {default: 0.01, meaning: "the largest difference between the band's gain and the chebyshev series that is accepted", unit: "fraction"}
  frames_per_cycle: {default: 36, meaning: "the frame density: frames to one cycle of the band's centre (the 10 degree step of phase work); the frame is the dyadic tile nearest it", unit: frames/cycle}
  frames_per_tile: {default: null, meaning: "the frame density per tile of the band instead (a power of two); wins over frames_per_cycle when given", unit: frames/tile}
  origin: {default: start, meaning: "the frames' origin as a point: start (the recording's first sample) | clock | event (a stored selection's first member)", unit: "-", choices: [start, clock, event]}
  bursts: {default: "global_bursts.bursts.{recording}", meaning: "the spans Selection the run uses, by name", unit: "-"}
  threshold_statistic: {default: "vortex_core_threshold.histogram.{recording}", meaning: "the stored distribution (pass one's output), by name", unit: "-"}
  percentile: {default: 98.0, meaning: "nxr CORE_PCT: the threshold is this percentile of |curl| over the burst frames, derived from the stored counts", unit: "percentile"}
  bad_segments: {default: exclude, meaning: "exclude | ignore the recording's bad spans", unit: "-"}
  block_frames: {default: 256, meaning: "the frames cut at once (memory only: the result does not depend on it)", unit: "frames"}
  link_mm: {default: 15.0, meaning: "nxr CORE_LINK: a core joins the nearest free track of the previous frame (same sense) within this distance of its last centre", unit: "mm"}
  stages: {default: [burst], meaning: "the stages the crossings are counted in: burst (every step), and onset, within, offset when their Selections exist (`global_bursts`: burst_onset, burst_within, burst_offset)", unit: "-"}
  onset: {default: "global_bursts.burst_onset.{recording}", meaning: "the burst onset spans, by name", unit: "-"}
  within: {default: "global_bursts.burst_within.{recording}", meaning: "the within-burst spans, by name", unit: "-"}
  offset: {default: "global_bursts.burst_offset.{recording}", meaning: "the burst offset spans, by name", unit: "-"}
  min_frames: {default: 2, meaning: "the tracks stored hold at least this many frames (2: a track has a step; nxr's lifetime statistics use 3 or more, a filter at read)", unit: "frames"}

steps:
  chunks:
    over: recording
    do:
      - {node: signal.analytic_frames, in: {x: recording, tiling: grid, within: bursts}, with: {band: $band, shape: $shape, frames_per_cycle: $frames_per_cycle, frames_per_tile: $frames_per_tile, origin: $origin}, out: z_frames}
      - {node: meeg.apply_kernel, in: {x: z_frames, kernel: kernel, tiles: tiles, glued: glued}, with: {spatial_scale: $spatial_scale, transform: $transform, modes: $modes, order: $order, tolerance: $tolerance, spatial_shape: $spatial_shape, form: curl_tan}, out: curl_frames}
      - node: select.events.cores
        in:   {x: curl_frames, threshold: threshold, exclude: bad}
        with: {percentile: $percentile, block_frames: $block_frames, bad_segments: $bad_segments}
        out:  [cores, frame, sense, centre_vertex, centre, area, peak]
  after:
    - node: select.events.tracks
      in:   {events: cores, frame: frame, sense: sense, centre: centre}
      with: {link_mm: $link_mm, min_frames: $min_frames}
      out:  [tracks, track_first_frame, track_last_frame, track_n_frames, track_path_length, track_displacement, track_sense, core_track]
    - node: select.tile_crossings
      in:   {events: cores, frame: frame, sense: sense, centre: centre, track: core_track, tiles: tiles, onset: onset, within: within, offset: offset}
      with: {spatial_scale: $spatial_scale, stages: $stages}
      out:  tile_crossings

outputs:
  cores:         {kind: spans, types: [core]}
  frame:         {kind: measurement}
  sense:         {kind: measurement}
  centre_vertex: {kind: measurement}
  centre:        {kind: measurement}
  area:          {kind: measurement}
  peak:          {kind: measurement}
  tracks:              {kind: spans, types: [track]}
  track_first_frame:   {kind: measurement}
  track_last_frame:    {kind: measurement}
  track_n_frames:      {kind: measurement}
  track_path_length:   {kind: measurement}
  track_displacement:  {kind: measurement}
  track_sense:         {kind: measurement}
  core_track:          {kind: measurement}
  tile_crossings:      {kind: measurement}
