# THE LCMV BEAMFORMER of a subject, from a head model (an operator of kind forward, gain channels x 3 sources), a DATA covariance and a NOISE covariance (statistics over one pick of the
# head model's channels, both made by `nxr-neuro run noisecov`: the data covariance on the recording the kernel is for, or on its band-passed copy (`run bandpass`, then `run noisecov` on
# its output), the noise covariance on the empty room) and the source surface, whose vertex normals orient the sources. Two conventions (`--conventions`):
#
# brainstorm (the default): fixed orientation, the pseudo neural activity index. Written from Van Veen et al. 1997 and the documented behaviour of Brainstorm's 2016 source estimation
# (process_inverse_2016 / bst_inverse_linear_2016, LCMV, measure NAI, orientation fixed, regularisation median) of its release of 2018-10-12, the version the MEG fingerprinting paper used
# (da Silva Castanheira J, Orozco Perez HD, Misic B, Baillet S (2021) Nat Commun 12:5713, doi:10.1038/s41467-021-25895-8; megFingerprinting v1.0.0, 06fdba8). Each covariance is truncated
# to its rank and regularised type by type; the kernel row of a source is (W_d l)^T W_d / ||W_d l|| (W_d the data whitener, l the gain along the normal). Stored: the kernel `<name>` (scalar),
# its channels `<name>_channels`, the noise whitener `<name>_whitener` (the reference stores it; the kernel does not use it) and the data whitener `<name>_data_whitener`.
#
# mne: MNE-Python's make_lcmv (1.13.2) with its defaults (reg 0.05, rank 'info', no depth weighting, pick_ori None, weight_norm 'unit-noise-gain-invariant') and its options pick_ori
# (free | normal | max-power) and weight_norm (none | unit-noise-gain | unit-noise-gain-invariant | nai). The noise covariance is optional (none: an identity covariance, one sensor type
# only) and whitens the gain and the data covariance; the projectors of the data's recording (with the average reference) are in its whitener. Stored: the kernel `<name>` (sources x
# channels; 3 rows a source, x y z, for free orientation), its channels and the noise whitener `<name>_whitener` the kernel ends with (none without a noise covariance).
#
# Every stored result carries its references (producer_json.references).
# It cannot resolve: correlated sources (they partly cancel); a weight-normalised output is an index relative to the data covariance's span, not a current; the regularisation trades
# resolution for stability.
#
#   nxr-neuro run noisecov --dataset <folder> --subject sub-01 --recording rest --all --block-seconds <10000 samples> --divisor samples_minus_one --name rest_data_cov
#   nxr-neuro run noisecov --dataset <folder> --subject sub-01 --recording emptyroom --all --block-seconds <10000 samples> --divisor samples_minus_one --name emptyroom_noise_cov
#   nxr-neuro run lcmv --dataset <folder> --subject sub-01 --data-cov rest_data_cov --noise-cov emptyroom_noise_cov [--forward NAME]
#   nxr-neuro run bandpass --dataset <folder> --subject sub-01 --recording rest --all --lower 7 --upper 13 --name rest_alpha
#   nxr-neuro run noisecov --dataset <folder> --subject sub-01 --recording rest_alpha --all --name rest_alpha_cov
#   nxr-neuro run lcmv --dataset <folder> --subject sub-01 --conventions mne --data-cov rest_alpha_cov --noise-cov emptyroom_noise_cov --pick-ori max-power --name LCMV_alpha
pipeline: lcmv
version: 1
description: the LCMV beamformer of a head model, a data covariance and a noise covariance (Brainstorm 2016 or MNE-Python make_lcmv conventions)
scope: subject

inputs:
  forward:          {operator: forward, where: {name: $forward}}
  data_covariance:  {statistic: any, where: {measure: covariance, name: $data_cov}}
  noise_covariance: {statistic: any, where: {measure: covariance, name: $noise_cov}, required: false, hint: "the empty room's covariance: `nxr-neuro run noisecov` on it (required under conventions brainstorm)"}
  sources:          {manifold: surface, is: forward.from}

parameters:
  forward: {default: none, meaning: "the head model's name, or none: the subject's one head model", unit: "-"}
  data_cov: {default: required, meaning: "the data covariance's name: a statistic of the recording the kernel is for (`nxr-neuro run noisecov` on it)", unit: "-"}
  noise_cov: {default: null, meaning: "the noise covariance's name: a statistic of the empty room (`nxr-neuro run noisecov` on it), covering the data covariance's channels; required under brainstorm; null (mne only): an identity covariance", unit: "-"}
  conventions: {default: brainstorm, meaning: "brainstorm (Brainstorm 2016: fixed orientation, the pseudo neural activity index) | mne (MNE-Python's make_lcmv)", unit: "-", choices: [brainstorm, mne]}
  name: {default: "{forward}_lcmv", meaning: "the kernel's name; beside it <name>_channels, <name>_whitener and <name>_data_whitener", unit: "-"}
  regularisation: {default: median, meaning: "brainstorm: how each covariance is regularised after truncation to its rank, type by type: median (the eigenvalue tail set to the median: the reference's) | ridge | diagonal | none", unit: "-", choices: [median, ridge, diagonal, none]}
  ridge_fraction: {default: 0.1, meaning: "brainstorm: the ridge's fraction of the largest eigenvalue (ridge only; the reference passes 0.1 with median, where it has no effect)", unit: "fraction"}
  detect_diagonal: {default: true, meaning: "brainstorm: a diagonal noise covariance whitens both covariances by their diagonal (the reference's rule)", unit: "-"}
  reg: {default: null, meaning: "mne: the diagonal loading of the whitened data covariance, a fraction of its mean singular value (MNE-Python's reg); null: 0.05", unit: "fraction"}
  pick_ori: {default: null, meaning: "mne: free (three rows a source, x y z) | normal (along the source surface's normals) | max-power (each source's orientation of most power, its sign along the normal); null: free", unit: "-", choices: [null, free, normal, max-power]}
  weight_norm: {default: null, meaning: "mne: none (unit gain, A.m) | unit-noise-gain | unit-noise-gain-invariant | nai (the neural activity index); null: unit-noise-gain-invariant (MNE-Python's default)", unit: "-", choices: [null, none, unit-noise-gain, unit-noise-gain-invariant, nai]}
  rank: {default: null, meaning: "mne: the covariances' rank, info (per modality: its channels less the projectors on them) or an integer (one modality only, e.g. the rank after Maxwell filtering); null: info", unit: "-"}
  average_reference: {default: true, meaning: "apply the average reference of EEG, sEEG and ECoG (brainstorm: to the gain and both covariances, per family; mne: as a projector, as MNE-Python requires)", unit: "-"}
  normals: {default: brainstorm, meaning: "the sources' orientations: brainstorm (the reference's VertNormals: minus the sum of the incident faces' unit normals, normalised) | corner_angle (geometry-central's corner-angle weighted normals)", unit: "-", choices: [brainstorm, corner_angle]}

steps:
  before:
    - node: meeg.lcmv
      in: {forward: forward, data_covariance: data_covariance, noise_covariance: noise_covariance, sources: sources}
      with: {conventions: $conventions, regularisation: $regularisation, ridge_fraction: $ridge_fraction, detect_diagonal: $detect_diagonal, reg: $reg, pick_ori: $pick_ori, weight_norm: $weight_norm, rank: $rank, average_reference: $average_reference, normals: $normals}
      out: [kernel, channels, whitener, data_whitener]

outputs:
  kernel:
    kind: operator
    operator_kind: inverse kernel
    name: $name
    from: forward.to
    to: forward.from
    from_selection: channels
    derived_from: forward
  channels:
    kind: selection
    type: indices
    name: "$name_channels"
    on: forward.to
  whitener:
    kind: operator
    operator_kind: whitener
    name: "$name_whitener"
    from: forward.to
    to: forward.to
    from_selection: channels
    to_selection: channels
    of_statistic: noise_covariance
  data_whitener:
    kind: operator
    operator_kind: whitener
    name: "$name_data_whitener"
    from: forward.to
    to: forward.to
    from_selection: channels
    to_selection: channels
    of_statistic: data_covariance
