# THE GLOBAL BURSTS AND THEIR EXTENTS over MANY LEVEL PAIRS in one pass (spec docs/specs/2026-11-13-cortical-events.md, phase 2e: the input of scale selection). `cortical_cell_pairs`' chain for every pair
# (spatial level l, time band b) of the product `space_levels` × `bands`, and for EACH pair, after the loop, what `global_bursts` does with one: the trace (the max over the level's spatial tiles of the cells'
# amplitude, whole brain or per hemisphere), its baseline and the pair's OWN global bursts (`detect_spans`, Rheome's 1.5 / 1.0 SD, 0.1 s joined, 0.4 s kept), the cells' per-tile baseline, and the extent of each
# burst on the pair's cells (`cell_extent`, a labelling of the joint cells: every connected region is an event). The same steps as `global_bursts`, unchanged, written once a pair by `for:`; the executor is generic.
# Not here (`global_bursts` has them for one pair): the sample trace and Rheome's rise-and-fall fit (`tile_max`, `collect`, `risefall`), the per-burst and per-event measures (`rollup_events`, `extent_measure`):
# they are per pair and per burst, not what scale selection reads. `run scaleselection` reads this run's stored cells, baselines and labellings.
#
# The JOINT SELECTIONS MUST EXIST, one per pair (`run joint`): a missing one is refused before any data is read, naming EVERY missing pair and its command. Each pair is stored as `cortical_cell_pairs`
# stores one (rows of the recording on the pair's joint Selection: `amplitude`, `envelope_max`, the `count` row), so a pair measured by either job is "made by another job" for the other (`--replace`).
#
# What is held (no limit set): as `cortical_cell_pairs` (the bound maps, the accumulators, a pair's chunk work), and after the loop the cells and labellings of every pair (S_l × T_b doubles and int32 a pair).
#
#   nxr-neuro run cortical_event_pairs --dataset <folder> --subject sub-01 --space-levels '[4,5]' --bands '[[4.0,8.0],[8.0,16.0]]' --all
#   nxr-neuro run scaleselection  --dataset <folder> --subject sub-01 --recording rest --space-levels 4,5 --time-levels 2,3
pipeline: cortical_event_pairs
version: 1
description: the global bursts of every (spatial level x time band) pair of two lists and the extent of each burst on that pair's cells, in one pass
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  kernel:    {operator: inverse kernel, from: recording.manifold.0, where: {name: $kernel, params.inverse.measure: $method}}
  tiles:     {selection: ladder, manifold: kernel.to}
  "cells_l{level}_b{band}":
    for: {band: $bands, level: $space_levels}
    selection: set
    where: {params.joint.space_level: $level, params.joint.band: $band, params.joint.recording: "{recording}"}
    hint: "make it with: nxr-neuro run joint  --recording {recording} --space-level {level} --time-level <the constant-Q level whose band is {band} Hz: `resolves_hz` lo_hi; a band that is no level has no joint partition>"
  bad:       {selection: spans, manifold: recording.time, where: {name: "{recording}_bad_segments"}, required: false}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  kernel: {default: none, meaning: "the inverse kernel's name, or none: found by `method` (the named kernel must also be of that method: --method)", unit: "-"}
  space_levels: {default: [5], meaning: "the surface ladder's levels: each one's Weyl band is its spatial band", unit: "level"}
  bands: {default: [[8.0, 16.0]], meaning: "Hz: each a time level's band (its `resolves_hz`); alpha at the hertz anchor", unit: "Hz"}
  shape: {default: meyer, meaning: "the temporal bands' shape: meyer here | morlet (a Gaussian centred on the band, its width the FWHM; bands overlap)", unit: "-"}
  spatial_shape: {default: meyer, meaning: "the spatial level's gain: meyer here (the levels add up: scale selection splits power across levels) | mexhat (the Mexican hat peaked at the Weyl band's geometric centre; levels overlap)", unit: "-"}
  method: {default: MNE, meaning: "the kernel's inverse method (its params.inverse.measure)", unit: "-"}
  transform: {default: auto, meaning: "the spatial band's transform (eigenmode first, chebyshev second): auto | eigen | chebyshev | exact (dense, at most 4096 vertices)", unit: "-"}
  modes: {default: 0, meaning: "when the eigenmodes are computed: the package's size; 0: the standard 3000, or more when a level needs it", unit: "modes"}
  order: {default: 0, meaning: "chebyshev degree; 0: the smallest of 40 … 5120 within `tolerance` of the band's gain", unit: "degree"}
  tolerance: {default: 0.01, meaning: "the largest difference between the band's gain and the chebyshev series that is accepted", unit: "fraction"}
  bad_segments: {default: exclude, meaning: "exclude | ignore the recording's bad spans", unit: "-"}
  groups: {default: whole_brain, meaning: "whole_brain | per_hemisphere: the trace's max over all the spatial tiles of a pair, or over each connected piece's", unit: "-"}
  combine: {default: mean, meaning: "the detection's series: mean (one global trace: GLOBAL events) | each (a trace a group: with per_hemisphere, each event carries its hemisphere)", unit: "-"}
  enter_sd: {default: 1.5, meaning: "Rheome's labelalpha (as band_bursts, global_bursts): the bursts' hysteresis on the trace", unit: "robust SD"}
  exit_sd: {default: 1.0, meaning: "robust SDs above the median to extend a burst (Rheome's loSD)", unit: "robust SD"}
  merge_s: {default: 0.1, meaning: "gaps up to this are joined", unit: "s"}
  min_s: {default: 0.4, meaning: "the shortest burst kept", unit: "s"}
  max_s: {default: null, meaning: "the longest burst kept; null: no limit", unit: "s"}
  extent_enter_sd: {default: 1.5, meaning: "the extent's hysteresis on z = (cell amplitude - the tile's median) / the tile's robust SD (as global_bursts')", unit: "robust SD"}
  extent_exit_sd: {default: 1.0, meaning: "the extent's lower hysteresis threshold", unit: "robust SD"}
  min_cells: {default: 1, meaning: "an event holds at least this many cells ...", unit: "cells"}
  min_area: {default: 0.0, meaning: "... and its cells' tiles at least this area (m2)", unit: "m2"}

steps:
  chunks:
    over: recording
    do:
      - for: {band: $bands}
        do:
          - step: analytic
            in:   {x: recording}
            with: {band: $band, shape: $shape}
            out:  "z_b{band}"
          - for: {level: $space_levels}
            do:
              - step: apply_kernel
                in:   {x: "z_b{band}", kernel: kernel, tiles: tiles}
                with: {level: $level, transform: $transform, modes: $modes, order: $order, tolerance: $tolerance, spatial_shape: $spatial_shape}
                out:  "sources_l{level}_b{band}"
              - step: magnitude
                in:   {x: "sources_l{level}_b{band}"}
                out:  "mag_l{level}_b{band}"
              - step: measure
                in:   {x: "mag_l{level}_b{band}", over: "cells_l{level}_b{band}", exclude: bad}
                with: {measure: amplitude, bad_segments: $bad_segments}
                out:  "amplitude_l{level}_b{band}"
              - step: measure
                in:   {x: "mag_l{level}_b{band}", over: "cells_l{level}_b{band}", exclude: bad}
                with: {measure: envelope_max, bad_segments: $bad_segments}
                out:  "peak_l{level}_b{band}"

  after:
    - for: {band: $bands, level: $space_levels}
      do:
        - {step: reduce_cells, in: {x: "amplitude_l{level}_b{band}"}, with: {groups: $groups}, out: "trace_l{level}_b{band}"}
        - {step: summarize, in: {x: "trace_l{level}_b{band}"}, with: {summaries: [median, mad], combine: $combine}, out: "trace_baseline_l{level}_b{band}"}
        - step: detect_spans
          in:   {x: "trace_l{level}_b{band}", baseline: "trace_baseline_l{level}_b{band}"}
          with: {combine: $combine, enter_sd: $enter_sd, exit_sd: $exit_sd, merge_s: $merge_s, min_s: $min_s, max_s: $max_s}
          out:  "bursts_l{level}_b{band}"
        - {step: summarize, in: {x: "amplitude_l{level}_b{band}"}, with: {summaries: [median, mad], combine: each}, out: "cell_baseline_l{level}_b{band}"}
        - step: cell_extent
          in:   {x: "amplitude_l{level}_b{band}", baseline: "cell_baseline_l{level}_b{band}", events: "bursts_l{level}_b{band}"}
          with: {enter_sd: $extent_enter_sd, exit_sd: $extent_exit_sd, min_cells: $min_cells, min_area: $min_area}
          out:  "extents_l{level}_b{band}"

outputs:
  "amplitude_l{level}_b{band}":
    for: {band: $bands, level: $space_levels}
    kind: measurement
  "peak_l{level}_b{band}":
    for: {band: $bands, level: $space_levels}
    kind: measurement
  "bursts_l{level}_b{band}":
    for: {band: $bands, level: $space_levels}
    kind: spans
    types: [burst]
  "cell_baseline_l{level}_b{band}":
    for: {band: $bands, level: $space_levels}
    kind: statistic
  "extents_l{level}_b{band}":
    for: {band: $bands, level: $space_levels}
    kind: labelling
