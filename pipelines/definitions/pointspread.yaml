# THE INSTRUMENT'S BLUR (a statistic of the recording it is measured for): a unit current at each sampled vertex (x, y and z separately) through the head model's gain and the
# kernel, read by the spatial events' chain (the power at each level of the surface's ladder on the glued domain, the patch round the reference level's peak cut at a fraction of it,
# the characteristic level of its centre). The blur of THIS head model and kernel, for a source alone: many sources blur together differently.
#
#   nxr-neuro run pointspread --dataset <folder> --subject sub-01 --recording rest --kernel KERNEL --levels "[2, 3, 4, 5]" --reference-level 4
pipeline: pointspread
version: 1
description: the instrument's blur at sampled vertices, read by the spatial events' chain
scope: subject

inputs:
  recording: {field: recording, where: {name: $recording}}
  kernel:    {operator: inverse kernel, where: {name: $kernel}}
  forward:   {operator: forward, where: {name: $forward}}

parameters:
  recording: {default: null, meaning: "the recording the blur is measured for (the statistic is OF it)", unit: "-"}
  kernel: {default: none, meaning: "the inverse kernel's name, or none: the subject's one inverse kernel", unit: "-"}
  forward: {default: none, meaning: "the head model's name, or none: the subject's one head model", unit: "-"}
  name: {default: "pointspread.{kernel}", meaning: "the stored statistic's name", unit: "-"}
  levels: {default: null, meaning: "the levels of the surface's ladder the blur is read at", unit: "level"}
  reference_level: {default: null, meaning: "the level whose peak the patch is cut round (one of the levels)", unit: "level"}
  fraction: {default: 0.5, meaning: "the patch is cut at this fraction of the peak", unit: "fraction"}
  vertices: {default: 64, meaning: "the number of sampled vertices (evenly spaced in index)", unit: "-"}
  list: {default: [], meaning: "the sampled vertices, stated (wins over vertices)", unit: "-"}
  transform: {default: auto, meaning: "the spatial bands' transform: auto | eigen | chebyshev", unit: "-"}
  modes: {default: null, meaning: "the eigenmodes used; null: the transform's", unit: "-"}
  order: {default: null, meaning: "the Chebyshev order; null: from the tolerance", unit: "-"}
  tolerance: {default: null, meaning: "the Chebyshev tolerance; null: the default", unit: "-"}
  spatial_shape: {default: mexhat, meaning: "the spatial level's gain: mexhat | meyer", unit: "-"}

steps:
  before:
    - {step: pointspread, in: {forward: forward, kernel: kernel}, with: {levels: $levels, reference_level: $reference_level, fraction: $fraction, vertices: $vertices, list: $list, transform: $transform, modes: $modes, order: $order, tolerance: $tolerance, spatial_shape: $spatial_shape}, out: spread}

outputs:
  spread:
    kind: statistic
    name: $name
    of: recording
    axes: [{name: source_vertex}, {name: orientation}, {name: measure}]
