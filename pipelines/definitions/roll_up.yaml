# A ROLL-UP through a grid's closed-form hierarchy, or ACROSS A GROUP's subjects (the node `roll_up`; one implementation, `nxr::measurement::roll_up` / `across`). The merge rule of every measure is DATA in the measures
# registry (sum, max, min, mean via sum and count, ratios derived at read), applied by io's query in SQL and by compute in memory, with a parity test between the two (rule 35).
#
# SUBJECT scope: a measurement over a GRID at level a rolled to a coarser level b (the target stated as a quantity: a tile diameter, a duration, `pieces`, `whole`). Refused over an irregular selection (the checker keys on
# the selection's family mark, rule 18).
# GROUP scope (`scope: group`): the same measurement in EACH member subject (`per_subject`) over the group tree's codes (`select_dyadic_surface` rule transfer), summed code for code and merged by measure, stored in the
# group's default subject (the template). The group is stated by the caller (`--subjects A,B,C` or a stored group selection by name): no default. In a catalogue dataset the inputs are read from each member package and the
# output written to the group package named by `--into`. Provenance lists each subject's measurement id and cache key. Replaces `pyramid reduce`.
#
#   nxr-neuro run roll_up --dataset <folder> --subjects A,B,C --measurement "rest cortex_band_pyramid power" --to "whole"
pipeline: roll_up
version: 1
description: a measurement rolled up through its grid's hierarchy, or across the subjects of a group, merged by each measure's rule
scope: group

inputs:
  x: {measurement: any, per_subject: true, where: {name: $measurement}, hint: "the measurement over a grid's members, found in each member subject"}

parameters:
  measurement: {default: null, meaning: "the measurement's name in each subject (the same over the group tree's codes)", unit: "-"}
  subjects: {default: null, meaning: "the group's subjects, by name (or a stored group selection by name); no default", unit: "-"}
  rolled_to: {default: whole, meaning: "the coarser level as a quantity: a tile diameter (mm), a duration (s), pieces (one member per connected piece) or whole (one member); for the group, the level the subjects are summed at is the measurement's own", unit: mm, chart: diameter}
  kernels: {default: all, meaning: "which source estimates of each member are summed: all, constrained, free, latest, or a kernel's method, stamp, name or glob (kinds combine with AND, tokens of one kind with OR)", unit: "-"}
  into: {default: null, meaning: "catalogue datasets: the group package the output is written to", unit: "-"}
  name: {default: "{measurement} group", meaning: "the rolled measurement's name in the default subject", unit: "-"}

steps:
  after:
    - {node: roll_up, in: {x: x}, with: {to: $rolled_to, kernels: $kernels}, out: y}

outputs:
  y: {kind: measurement, name: $name, over: x}
