# THE STRUCTURAL CONNECTOME OVER A PARTITION (spec docs/specs/2026-11-16-structural-connectome.md; outputs: docs/specs/2026-11-17-definition-outputs.md). DRAFT, NOT YET SHIPPED: it
# is written on the nodes that are registered and on the declarations the runner does not read yet (listed under "Needs", below), so it sits here, outside the `definitions/*.yaml`
# that are compiled in. When the runner has them, it moves up one folder and its test (`test_connectome_definition`) runs it through `run connectome`.
#
#   nxr-neuro run connectome --fibers tracts --end-surface pial --over desikan-killiany [--smooth-hops N] [--max-end-distance MM|none] --dataset d --subject s
#
# `--fibers`, `--end-surface` and `--over` are REQUIRED (each is a choice of data): their default is `required`, which the reader refuses to run with.
# The counts are a MEASUREMENT over the partition: the fibers are the elements, the region pairs the members; two codes a row (the region and the other), both orders, the
# within-region pairs stored (a fiber with both ends in one region adds 2 at its diagonal). Smoothing is pushed onto the memberships (the adjoint of the mesh's smoothing step):
# the vertex matrix is never formed here. Default smoothing: 0 hops for a partition (3 at the vertex level, `connectome_vertices`).
#
# Needs (runner features this definition declares and the runner does not read yet):
#   1. input classes `curve` (a fiber bundle: its points and `points_per_fiber`), `surface` (positions, faces) and `selection: partition` read as a label per vertex;
#   2. a required parameter (default `required`: refused when missing, naming it and its valid values);
#   3. an output of kind `measurement` made of an ARRAY (`counts`, COO regions x regions) with two codes a row (`codes: 2`), on the input partition;
#   4. the provenance of an output taking the input bundle's `origin` (source, version, citation, licence) when it has one: see `connectome_template`.
pipeline: connectome
version: 1
description: the fiber counts between the regions of a partition of the end surface (a measurement over the partition), from a fiber bundle's ends
scope: subject

inputs:
  fibers:    {curve: fibers, where: {name: $fibers}}
  surface:   {surface: cortex, where: {name: $end_surface}}
  partition: {selection: partition, manifold: surface, where: {name: $over}}

parameters:
  fibers:       {default: required, meaning: "the fiber bundle's name (the subject's own: `curve/<name>`)", unit: "-"}
  end_surface:  {default: required, meaning: "the surface the fibers' ends are placed on (a location on the cortex, not a depth)", unit: "-"}
  over:         {default: required, meaning: "the partition of the end surface the counts are reduced over: a parcellation or a tile level of the ladder", unit: "-"}
  smooth_hops:  {default: 0, meaning: "hops of the mesh smoothing, applied to the partition's memberships (0: the plain fiber count)", unit: "hops"}
  max_end_distance: {default: 5, meaning: "a fiber with an end farther than this from the end surface is left out; none: no gate (the reference)", unit: "mm"}
  points_per_fiber: {default: 0, meaning: "the points of each fiber (read from the bundle when 0)", unit: "points"}
  name: {default: "{fibers}_{end_surface}_fiber_counts", meaning: "the stored name of the counts", unit: "-"}

steps:
  before:
    - {node: fiber_ends,         in: {fibers: fibers},                                       with: {points_per_fiber: $points_per_fiber}, out: end_points}
    - {node: nearest_vertex,     in: {points: end_points, positions: surface},                                                           out: [end_vertex, end_distance]}
    - {node: end_gate,           in: {end_distance: end_distance},                           with: {max_end_distance_mm: $max_end_distance}, out: keep}
    - {node: smooth_memberships, in: {label: partition, faces: surface},                     with: {hops: $smooth_hops},                  out: memberships}
    - {node: partition_counts,   in: {end_vertex: end_vertex, keep: keep, memberships: memberships},                                      out: counts}

outputs:
  counts:
    kind: measurement
    name: $name
    over: partition
    of: fibers
    codes: 2
    unit: fibers
    description: "fiber_count (connection_weight when smoothed) between the regions of the partition, both orders, the within-region count at the diagonal"
