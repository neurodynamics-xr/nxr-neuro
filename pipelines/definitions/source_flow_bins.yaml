# THE WHOLE-RECORDING SOURCE FLOW, NO WAVELETS (spec docs/specs/2026-11-24-source-flow.md): the flow of the cortical current estimate per frequency bin of the whole recording (the net
# quadrature), from the same nodes as `source_flow`: a minimum-norm kernel projected onto the cortex's eigenmodes (options A and B, per hemisphere or glued), the sensor chain's serving,
# and signal.cortical_flow with frequency_weighting every_bin (C_k = the sum over the chunks of each chunk's spectrum times its conjugate) or a SHARP set of bins (grouped).
# With --bands, every pair of the cortical bands too. No atoms, no time cells.
#
# What it cannot resolve: the net quadrature only (motion that cancels over the run appears as standing); the same estimate as the kernel, in other coordinates (its point spread, depth
# bias and field spread inherited); per hemisphere no flow across the midline, glued no medial-wall sources.
#
#   nxr-neuro run source_flow_bins --dataset D --subject S --recording REC --all --kernel KERNEL --cortex per_hemisphere --left LEFT --right RIGHT --columns channels [--bands BANDS --banded true]
pipeline: source_flow_bins
version: 1
description: the whole-recording flow of the cortical current per frequency bin (or per sharp group of bins) - a minimum-norm kernel projected onto the cortex's eigenmodes, power, phase currents, Hodge-Dirac flow, optionally cortical band pairs; no wavelets
scope: subject

inputs:
  recording:      {field: recording, each: true, where: {name: $recording}}
  kernel:         {operator: inverse kernel, from: recording.manifold.0, where: {name: $kernel}, hint: "a free-orientation minimum-norm kernel (`nxr-neuro run inverse` first)"}
  left:           {operator: eigenvectors, where: {name: "${left}_eigenvectors"}, when: {cortex: per_hemisphere}, hint: "the left hemisphere's Hodge-Dirac solve"}
  right:          {operator: eigenvectors, where: {name: "${right}_eigenvectors"}, when: {cortex: per_hemisphere}, hint: "the right hemisphere's Hodge-Dirac solve"}
  glued:          {operator: eigenvectors, where: {name: "${glued}_eigenvectors"}, when: {cortex: glued}, hint: "the glued cortex's Hodge-Dirac solve"}
  sensor_package: {operator: eigenvectors, where: {name: "${sensor_package}_eigenvectors"}, when: {columns: sensor_coordinates}, hint: "the sensor surface's Hodge-Dirac solve (option A)"}
  channel_map:    {field: any, where: {name: $channel_map}, when: {columns: sensor_coordinates}, hint: "the sensor surface's vertex-to-channel map (option A)"}
  groups:         {selection: any, where: {name: $groups}, when: $grouped, hint: "sharp groups of bins: a kernel set of boxes on the frequency line (`nxr-neuro run select_kernels --profile box --chart linear`)"}
  pairs:          {selection: any, where: {name: $pairs}, when: {grouped: true, banded: true}, hint: "grouped and banded: the product groups x bands x bands (`nxr-neuro run select_kernel_product --factors 3`), the band pairs' members"}
  bands:          {selection: any, where: {name: $bands}, when: $banded, hint: "the cortical eigenvalue bands, a kernel set (`nxr-neuro run select_kernels --profile cos2_partition`)"}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  kernel: {default: null, meaning: "the free-orientation minimum-norm kernel's name", unit: "-"}
  cortex: {default: per_hemisphere, meaning: "per_hemisphere (the reference's) | glued, as source_flow", unit: "-", choices: [per_hemisphere, glued]}
  left: {default: null, meaning: "per_hemisphere: the left hemisphere's Hodge-Dirac solve's stem", unit: "-"}
  right: {default: null, meaning: "per_hemisphere: the right hemisphere's Hodge-Dirac solve's stem", unit: "-"}
  glued: {default: null, meaning: "glued: the glued cortex's Hodge-Dirac solve's stem", unit: "-"}
  columns: {default: channels, meaning: "channels (option B, the reference's) | sensor_coordinates (option A), as source_flow", unit: "-", choices: [sensor_coordinates, channels]}
  sensor_package: {default: null, meaning: "option A: the sensor surface's Hodge-Dirac solve's stem", unit: "-"}
  channel_map: {default: null, meaning: "option A: the sensor surface's vertex-to-channel map's name", unit: "-"}
  groups: {default: null, meaning: "sharp groups of bins by name (with grouped true); null: every bin alone", unit: "-"}
  bands: {default: null, meaning: "the cortical eigenvalue bands by name (with banded true); null: the whole field only", unit: "-"}
  pairs: {default: null, meaning: "grouped and banded: the product groups x bands x bands by name (the band pairs are measured over its members)", unit: "-"}
  grouped: {default: false, meaning: "true: the bins grouped by the sharp kernel set named in groups", unit: "-"}
  banded: {default: false, meaning: "true: also every pair of the cortical bands named in bands", unit: "-"}
  overlap_samples: {default: 16384, meaning: "the overlap on each side of a chunk: half a chunk", unit: samples}
  transform_samples: {default: 65536, meaning: "each chunk's one transform: the chunk and its two overlaps", unit: samples}
  frequency_span: {default: [0, 60], meaning: "[lo, hi) the bins kept", unit: Hz}
  name: {default: "{recording}_{kernel}_bins", meaning: "the stem of the stored names", unit: "-"}

steps:
  before:
    - {node: signal.mode_analysis, in: {package: sensor_package, channel_map: channel_map}, with: {modes: exact_and_constant, normalisation: unit_mass}, out: sensor_operator, when: {columns: sensor_coordinates}}
    - {node: signal.mode_analysis, in: {package: left, kernel: kernel}, with: {modes: exact_and_constant, normalisation: unit_mass}, out: left_cortex, when: {cortex: per_hemisphere}}
    - {node: signal.source_mode_operator, in: {cortex_operator: left_cortex, kernel: kernel, package: left, sensor_operator: sensor_operator, sensor_package: sensor_package}, with: {columns: sensor_coordinates}, out: [left_operator, left_kernel_columns, serving], when: {cortex: per_hemisphere, columns: sensor_coordinates}}
    - {node: signal.source_mode_operator, in: {cortex_operator: left_cortex, kernel: kernel, package: left}, with: {columns: channels}, out: [left_operator, left_kernel_columns, serving], when: {cortex: per_hemisphere, columns: channels}}
    - {node: signal.mode_analysis, in: {package: right, kernel: kernel}, with: {modes: exact_and_constant, normalisation: unit_mass}, out: right_cortex, when: {cortex: per_hemisphere}}
    - {node: signal.source_mode_operator, in: {cortex_operator: right_cortex, kernel: kernel, package: right, sensor_operator: sensor_operator, sensor_package: sensor_package}, with: {columns: sensor_coordinates}, out: [right_operator, right_kernel_columns, right_serving], when: {cortex: per_hemisphere, columns: sensor_coordinates}}
    - {node: signal.source_mode_operator, in: {cortex_operator: right_cortex, kernel: kernel, package: right}, with: {columns: channels}, out: [right_operator, right_kernel_columns, right_serving], when: {cortex: per_hemisphere, columns: channels}}
    - {node: signal.mode_analysis, in: {package: glued, kernel: kernel}, with: {modes: exact_and_constant, normalisation: unit_mass}, out: glued_cortex, when: {cortex: glued}}
    - {node: signal.source_mode_operator, in: {cortex_operator: glued_cortex, kernel: kernel, package: glued, sensor_operator: sensor_operator, sensor_package: sensor_package}, with: {columns: sensor_coordinates}, out: [glued_operator, glued_kernel_columns, serving], when: {cortex: glued, columns: sensor_coordinates}}
    - {node: signal.source_mode_operator, in: {cortex_operator: glued_cortex, kernel: kernel, package: glued}, with: {columns: channels}, out: [glued_operator, glued_kernel_columns, serving], when: {cortex: glued, columns: channels}}
  chunks:
    over: recording
    do:
      - {node: signal.overlapped_spectrum, in: {x: recording, operator: serving}, with: {overlap_samples: $overlap_samples, transform_samples: $transform_samples, frequency_span: $frequency_span}, out: spectrum}
      - {node: signal.chunk_spectra, in: {spectrum: spectrum, operator: serving}, out: spectra}
  after:
    - {node: signal.cortical_flow, in: {spectra: spectra, package: left, operator: left_operator, kernel_columns: left_kernel_columns}, with: {frequency_weighting: every_bin}, out: [left_whole_vertices, left_whole_edges, left_whole_modes, left_pair_vertices, left_pair_edges, left_pair_modes], when: {cortex: per_hemisphere, grouped: false, banded: false}}
    - {node: signal.cortical_flow, in: {spectra: spectra, package: left, operator: left_operator, kernel_columns: left_kernel_columns, scale: bands}, with: {frequency_weighting: every_bin}, out: [left_whole_vertices, left_whole_edges, left_whole_modes, left_pair_vertices, left_pair_edges, left_pair_modes], when: {cortex: per_hemisphere, grouped: false, banded: true}}
    - {node: signal.cortical_flow, in: {spectra: spectra, package: left, operator: left_operator, kernel_columns: left_kernel_columns, frequency: groups}, with: {measure_suffix: _left, frequency_weighting: kernels, frequency_normalisation: none}, out: [left_group_vertices, left_group_edges, left_group_modes, left_group_pair_vertices, left_group_pair_edges, left_group_pair_modes], when: {cortex: per_hemisphere, grouped: true, banded: false}}
    - {node: signal.cortical_flow, in: {spectra: spectra, package: left, operator: left_operator, kernel_columns: left_kernel_columns, frequency: groups, scale: bands}, with: {measure_suffix: _left, frequency_weighting: kernels, frequency_normalisation: none}, out: [left_group_vertices, left_group_edges, left_group_modes, left_group_pair_vertices, left_group_pair_edges, left_group_pair_modes], when: {cortex: per_hemisphere, grouped: true, banded: true}}
    - {node: signal.cortical_flow, in: {spectra: spectra, package: right, operator: right_operator, kernel_columns: right_kernel_columns}, with: {frequency_weighting: every_bin}, out: [right_whole_vertices, right_whole_edges, right_whole_modes, right_pair_vertices, right_pair_edges, right_pair_modes], when: {cortex: per_hemisphere, grouped: false, banded: false}}
    - {node: signal.cortical_flow, in: {spectra: spectra, package: right, operator: right_operator, kernel_columns: right_kernel_columns, scale: bands}, with: {frequency_weighting: every_bin}, out: [right_whole_vertices, right_whole_edges, right_whole_modes, right_pair_vertices, right_pair_edges, right_pair_modes], when: {cortex: per_hemisphere, grouped: false, banded: true}}
    - {node: signal.cortical_flow, in: {spectra: spectra, package: right, operator: right_operator, kernel_columns: right_kernel_columns, frequency: groups}, with: {measure_suffix: _right, frequency_weighting: kernels, frequency_normalisation: none}, out: [right_group_vertices, right_group_edges, right_group_modes, right_group_pair_vertices, right_group_pair_edges, right_group_pair_modes], when: {cortex: per_hemisphere, grouped: true, banded: false}}
    - {node: signal.cortical_flow, in: {spectra: spectra, package: right, operator: right_operator, kernel_columns: right_kernel_columns, frequency: groups, scale: bands}, with: {measure_suffix: _right, frequency_weighting: kernels, frequency_normalisation: none}, out: [right_group_vertices, right_group_edges, right_group_modes, right_group_pair_vertices, right_group_pair_edges, right_group_pair_modes], when: {cortex: per_hemisphere, grouped: true, banded: true}}
    - {node: signal.cortical_flow, in: {spectra: spectra, package: glued, operator: glued_operator, kernel_columns: glued_kernel_columns}, with: {frequency_weighting: every_bin}, out: [glued_whole_vertices, glued_whole_edges, glued_whole_modes, glued_pair_vertices, glued_pair_edges, glued_pair_modes], when: {cortex: glued, grouped: false, banded: false}}
    - {node: signal.cortical_flow, in: {spectra: spectra, package: glued, operator: glued_operator, kernel_columns: glued_kernel_columns, scale: bands}, with: {frequency_weighting: every_bin}, out: [glued_whole_vertices, glued_whole_edges, glued_whole_modes, glued_pair_vertices, glued_pair_edges, glued_pair_modes], when: {cortex: glued, grouped: false, banded: true}}
    - {node: signal.cortical_flow, in: {spectra: spectra, package: glued, operator: glued_operator, kernel_columns: glued_kernel_columns, frequency: groups}, with: {frequency_weighting: kernels, frequency_normalisation: none}, out: [glued_group_vertices, glued_group_edges, glued_group_modes, glued_group_pair_vertices, glued_group_pair_edges, glued_group_pair_modes], when: {cortex: glued, grouped: true, banded: false}}
    - {node: signal.cortical_flow, in: {spectra: spectra, package: glued, operator: glued_operator, kernel_columns: glued_kernel_columns, frequency: groups, scale: bands}, with: {frequency_weighting: kernels, frequency_normalisation: none}, out: [glued_group_vertices, glued_group_edges, glued_group_modes, glued_group_pair_vertices, glued_group_pair_edges, glued_group_pair_modes], when: {cortex: glued, grouped: true, banded: true}}

outputs:
  # per hemisphere: each side's measures carry its suffix (measure_suffix _left / _right: one recording, one selection, two surfaces; #264)
  spectra: {kind: statistic, name: "{name}_chunk_spectra", of: recording}
  left_whole_vertices: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: false}}
  left_group_vertices: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: true}}
  left_whole_edges: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: false}}
  left_group_edges: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: true}}
  left_whole_modes: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: false}}
  left_group_modes: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: true}}
  left_pair_vertices: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: false}}
  left_group_pair_vertices: {kind: measurement, over: pairs, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: true}}
  left_pair_edges: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: false}}
  left_group_pair_edges: {kind: measurement, over: pairs, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: true}}
  left_pair_modes: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: false}}
  left_group_pair_modes: {kind: measurement, over: pairs, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: true}}
  right_whole_vertices: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: false}}
  right_group_vertices: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: true}}
  right_whole_edges: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: false}}
  right_group_edges: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: true}}
  right_whole_modes: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: false}}
  right_group_modes: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, grouped: true}}
  right_pair_vertices: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: false}}
  right_group_pair_vertices: {kind: measurement, over: pairs, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: true}}
  right_pair_edges: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: false}}
  right_group_pair_edges: {kind: measurement, over: pairs, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: true}}
  right_pair_modes: {kind: measurement, over: groups, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: false}}
  right_group_pair_modes: {kind: measurement, over: pairs, of: recording, when: {cortex: per_hemisphere, banded: true, grouped: true}}
  glued_whole_vertices: {kind: statistic, name: "{name}_glued_flow_vertices", of: recording, when: {cortex: glued, grouped: false}}
  glued_group_vertices: {kind: measurement, over: groups, of: recording, when: {cortex: glued, grouped: true}}
  glued_whole_edges: {kind: statistic, name: "{name}_glued_flow_edges", of: recording, when: {cortex: glued, grouped: false}}
  glued_group_edges: {kind: measurement, over: groups, of: recording, when: {cortex: glued, grouped: true}}
  glued_whole_modes: {kind: statistic, name: "{name}_glued_flow_modes", of: recording, when: {cortex: glued, grouped: false}}
  glued_group_modes: {kind: measurement, over: groups, of: recording, when: {cortex: glued, grouped: true}}
  glued_pair_vertices: {kind: statistic, name: "{name}_glued_band_pair_vertices", of: recording, when: {cortex: glued, banded: true, grouped: false}}
  glued_group_pair_vertices: {kind: measurement, over: pairs, of: recording, when: {cortex: glued, banded: true, grouped: true}}
  glued_pair_edges: {kind: statistic, name: "{name}_glued_band_pair_edges", of: recording, when: {cortex: glued, banded: true, grouped: false}}
  glued_group_pair_edges: {kind: measurement, over: pairs, of: recording, when: {cortex: glued, banded: true, grouped: true}}
  glued_pair_modes: {kind: statistic, name: "{name}_glued_band_pair_modes", of: recording, when: {cortex: glued, banded: true, grouped: false}}
  glued_group_pair_modes: {kind: measurement, over: pairs, of: recording, when: {cortex: glued, banded: true, grouped: true}}
