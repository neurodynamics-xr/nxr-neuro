# PATCHES ON A STATIC CORTICAL MAP: where a scalar map on a surface has regions above its own baseline, at one scale (a quantity). The map is filtered to the level's Weyl band (the band, a field); the band's
# mean (area-weighted by the vertices' barycentric areas), max, min and abs_max are measured per tile of the level; the median and the robust SD (1.4826 MAD) of the tile means are the baseline;
# the regions of the signed tile means reaching median + enter_sd SDs, extended over the tiles at median + exit_sd SDs (hysteresis over the tile graph: tiles joined by a mesh edge, hemispheres never
# touch) are the patches (a set selection on the surface: code = the patch's ordinal, by its lowest tile); the band's values over the patches, the patches' own measures (area, tiles, centre vertex)
# and the summaries across the patches of area, tiles, mean and peak follow. It builds no instrument limit into the detection (min_area and max_area are the caller's, named) and it does not merge
# patches that do not touch. The surface's ladder comes first (`nxr-neuro run select_dyadic_surface`).
#
#   nxr-neuro run patches --dataset <folder> --subject sub-01 --map rest_alpha_power --spatial-scale "wavelength 40 mm" --sign positive
pipeline: patches
version: 2
description: the patches of a scalar map at one spatial scale of the surface's grid, with their measurements and summaries
scope: subject

inputs:
  map:     {field: any, where: {name: $map}}
  surface: {manifold: surface, is: map.manifold.0}
  tiles:   {selection: ladder, manifold: map.manifold.0, hint: "the surface's grid (`nxr-neuro run select_dyadic_surface` first)"}

parameters:
  map: {default: null, meaning: "the stored field to find patches in (a scalar per vertex of a surface, every value finite)", unit: "-"}
  spatial_scale: {default: null, meaning: "the scale as a quantity: a tile diameter (20 mm), a wavelength (wavelength 40 mm), an eigenvalue or a named scale; its Weyl band is the map's filter, its tiles the partition (resolved to the grid's level in closed form and recorded with the snapped quantity)", unit: mm, chart: wavelength}
  sign: {default: positive, meaning: "positive (bumps: high values) | negative (dips) | magnitude (|x|): applied to the tile means before the thresholds", unit: "-", choices: [positive, negative, magnitude]}
  enter_sd: {default: 1.5, meaning: "a region must reach median + enter_sd robust SDs (Rheome's hiSD, as band_bursts)", unit: "SD"}
  exit_sd: {default: 1.0, meaning: "and extends over tiles at median + exit_sd robust SDs (loSD)", unit: "SD"}
  min_area: {default: null, meaning: "the smallest patch kept, as an area; null: none (the caller's size, never an instrument's)", unit: mm2, chart: area}
  max_area: {default: null, meaning: "the largest patch kept, as an area; null: none", unit: mm2, chart: area}
  transform: {default: auto, meaning: "the spatial band's transform: auto (eigenmodes first, chebyshev an announced fallback) | eigen | chebyshev | exact", unit: "-"}
  modes: {default: null, meaning: "the eigenmodes made when the package is computed; null: the standard", unit: "-"}
  order: {default: null, meaning: "the Chebyshev order; null: from the tolerance", unit: "-"}
  tolerance: {default: null, meaning: "the Chebyshev tolerance; null: the default", unit: "-"}
  summaries: {default: [count, sum, median, mean, sd, "percentile:25", "percentile:75", "percentile:90"], meaning: "the summaries across the patches", unit: "-"}

steps:
  before:
    - {step: select.patch_summaries, in: {map: map, tiles: tiles}, with: {spatial_scale: $spatial_scale, sign: $sign, enter_sd: $enter_sd, exit_sd: $exit_sd, min_area: $min_area, max_area: $max_area, transform: $transform, modes: $modes, order: $order, tolerance: $tolerance, summaries: $summaries}, out: [band, tile_measures, baseline, patches, patch_measures, patch_own, area, n_tiles, mean, peak]}

outputs:
  band:
    kind: field
    kind_name: map
    name: "{map}_band_${spatial_scale}"
    on: map.manifold.0
  tile_measures:
    kind: measurement
    over: tiles
    of: band
  baseline:
    kind: statistic
    name: "{map}_band_${spatial_scale}_baseline"
    of: band
    over: tiles
    axes: [{name: row}, {name: summary}]
  patches:
    kind: selection
    type: set
    name: "{map} patches ${spatial_scale} ${sign}"
    on: map.manifold.0
  patch_measures:
    kind: measurement
    over: patches
    of: band
  patch_own:
    kind: measurement
    name: "{map}_patches_${spatial_scale}_${sign}_own"
    over: patches
    of: band
  area:
    kind: statistic
    name: "{map}_patches_${spatial_scale}_${sign}_area"
    of: band
    over: patches
    axes: [{name: row}, {name: summary}]
  n_tiles:
    kind: statistic
    name: "{map}_patches_${spatial_scale}_${sign}_n_tiles"
    of: band
    over: patches
    axes: [{name: row}, {name: summary}]
  mean:
    kind: statistic
    name: "{map}_patches_${spatial_scale}_${sign}_mean"
    of: band
    over: patches
    axes: [{name: row}, {name: summary}]
  peak:
    kind: statistic
    name: "{map}_patches_${spatial_scale}_${sign}_peak"
    of: band
    over: patches
    axes: [{name: row}, {name: summary}]
