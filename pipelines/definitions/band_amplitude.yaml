# THE AMPLITUDE OF A RECORDING'S CHANNELS IN NAMED FREQUENCY BANDS, on each band's own time grid.
# A named band set is a SELECTION, made first (select.bands: spans [lo, hi) on the frequency line, the names its lookup). A single band selects: it sets the time grid (the dyadic
# tile that holds 4 cycles of the band's centre: the Studio's fitLevelOf), and the amplitude (mean |X| over the band's bins of each tile's one-sided FFT, no window) is measured per
# channel per tile of that grid. ONE measurement per band, stored on its grid: rows = channels, columns = the grid's members (the array's attributes say so). The bands have no default.
# Stored: the frequency line `<recording>_fft_freq`, the band set `<name>_bands`, and per band the grid `<name>_<lo>_<hi>_tiles` (a tiling of the recording's time line) and the measurement over it.
#
#   nxr-neuro run band_amplitude --dataset <folder> --subject sub-01 --recording rest --from 0 --to 27.3 --bands '[[8,13],[13,30]]' --band_names '["alpha","beta"]'
pipeline: band_amplitude
version: 2
description: the amplitude of a recording's channels in named frequency bands, per time tile of the grid each band sets
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  bands: {default: null, meaning: "the bands: a list of [lo, hi] in Hz, each the span [lo, hi) of the frequency line (required, no default)", unit: "Hz"}
  band_names: {default: null, meaning: "one name per band; none: the range, e.g. 8-13", unit: "-"}
  name: {default: "band_amplitude", meaning: "the stored names' root: the band set is <name>_bands, a band's grid <name>_<lo>_<hi>_tiles", unit: "-"}

steps:
  chunks:
    over: recording
    do:
      - {node: select.bands, in: {x: recording}, with: {bands: $bands, band_names: $band_names}, out: [freq, bands]}
      - for: {band: $bands}
        do:
          - {node: measure.band_amplitude, in: {x: recording}, with: {band: $band, bands: $bands, band_names: $band_names}, out: ["grid_b{band}", "amplitude_b{band}"]}

outputs:
  freq:
    kind: manifold
    type: line
    name: "{recording}_fft_freq"
  bands:
    kind: selection
    type: spans
    name: "$name_bands"
    on: freq
  "grid_b{band}":
    for: {band: $bands}
    kind: selection
    type: tiling
    name: "$name_{band}_tiles"
    on: recording.time
  "amplitude_b{band}":
    for: {band: $bands}
    kind: measurement
    over: "grid_b{band}"
    of: recording
