# THE AMPLITUDE OF A RECORDING'S CHANNELS IN NAMED FREQUENCY BANDS: the one-sided FFT of every chunk (no window or taper), the mean |X| over the bins of each band.
# The bands are a set of spans on the spectrum's frequency line (the lookup names them); the amplitude is measured over that set, per channel and chunk. The bands have no default.
# Stored: the frequency line `<recording>_fft_freq`, the selection `<name>_bands` (spans, their names the dictionary) and the amplitude rows over it (of the recording).
#
#   nxr-neuro run band_amplitude --dataset <folder> --subject sub-01 --recording rest --from 0 --to 27.3 --bands '[{"name":"alpha","lo":8,"hi":13}]'
pipeline: band_amplitude
version: 1
description: the amplitude of a recording's channels in named frequency bands, from each chunk's FFT
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  bands: {default: null, meaning: "the bands: a list of {name, lo, hi} in Hz, each the span [lo, hi) of the frequency line (required, no default)", unit: "Hz"}
  name: {default: "{recording}_band_amplitude", meaning: "the stored names' root: the selection is <name>_bands", unit: "-"}

steps:
  chunks:
    over: recording
    do:
      - {node: fft.spectrum, in: {x: recording}, out: spectrum}
      - {node: measure.band_amplitude, in: {spectrum: spectrum}, with: {bands: $bands}, out: [freq, bands, measurement]}

outputs:
  freq:
    kind: manifold
    type: line
    name: "{recording}_fft_freq"
  bands:
    kind: selection
    type: spans
    name: "$name_bands"
    on: freq
  measurement:
    kind: measurement
    over: bands
    of: recording
