# A STATISTIC OF MEASUREMENTS OVER A SELECTION'S MEMBERS: the values of a measure over the members (of a field; of a band of a map statistic, `of_slice`; or the members' own:
# area, n_elements, with `own`), summarised per row (each), pooled, or as the mean of the rows' (mean): mean, sd, median, percentiles, ... The statistic is OF the field `of`
# (the map statistic's field for a slice) and over the selection `over`.
#
#   nxr-neuro run statistic --dataset <folder> --subject sub-01 --over "cortex tiles L4" --of rest_kernel_phasegradient_alpha --measure phase_power --summaries "[mean, sd, median]"
pipeline: statistic
version: 1
description: the summaries of a measure's values over a selection's members
scope: subject

inputs:
  over: {selection: any, where: {name: $over}}
  of:   {field: any, where: {name: $of}}

parameters:
  over: {default: null, meaning: "the selection whose members are summarised", unit: "-"}
  of: {default: null, meaning: "the field measured (the map statistic's field when of_slice is given)", unit: "-"}
  of_slice: {default: null, meaning: "a band of a map statistic, by its name; null: the field's own measurements", unit: "-"}
  measure: {default: null, meaning: "the measure summarised", unit: "-"}
  summaries: {default: [mean, sd], meaning: "the summaries: mean, sd, median, mad, min, max, skewness, kurtosis, percentile:P", unit: "-"}
  combine: {default: each, meaning: "each = per row | pool = the rows pooled | mean = the mean of the rows' summaries", unit: "-", choices: [each, pool, mean]}
  ddof: {default: 1, meaning: "the degrees of freedom removed from the sd's divisor", unit: "-"}
  own: {default: false, meaning: "the measure is the members' own (area, n_elements, n_tiles), not of the field", unit: "-"}
  name: {default: "{of}_{measure}_{over}", meaning: "the stored statistic's name", unit: "-"}

steps:
  before:
    - {step: summarize, in: {over: over, of: of}, with: {measure: $measure, of_slice: $of_slice, summaries: $summaries, combine: $combine, ddof: $ddof, own: $own}, out: statistic}

outputs:
  statistic:
    kind: statistic
    name: $name
    of: of
    over: over
    axes: [{name: row}, {name: summary}]
