# A KERNEL SET on a line: the selection system's kernel members (an anchor + a profile + a chart) as ONE stored selection, so every measurement over its members (alone, or the cells of
# a product with another set: a joint filterbank of frequency members x scale members) is found by its member. The line is a stored manifold named by the caller: a frequency line (the
# coefficients' `<recording>_freq`), or a mode axis (a Hodge-Dirac package's, its coordinate the wavenumber mu). Every centre is a quantity, every profile parameter the caller's.
#
#   nxr-neuro run select_kernels --dataset D --subject S --line <recording>_freq --quantity frequency --profile gaussian --chart log2 --width 0.125 --gain 1
#                                --grid-from 1 --grid-to 58 --voices 8 --name "<recording> frequency kernels V8"
#   nxr-neuro run select_kernels --dataset D --subject S --line hodgeDirac__cortex_pial_low_glued --quantity wavelength --profile gaussian --chart log2 --width 0.5 --gain 1
#                                --centres '[400, 200, 100, 50]' --name "glued scale kernels"
pipeline: select_kernels
version: 1
description: a kernel set on a stored line (a frequency line or a mode axis) - one selection whose members are kernels (anchor, profile, chart, gain)
scope: subject

inputs:
  line: {manifold: any, where: {name: $line}, hint: "the stored line the kernels lie on: a frequency line or a mode axis, by name"}

parameters:
  line: {default: null, meaning: "the line's name", unit: "-"}
  quantity: {default: null, meaning: "frequency (Hz) | wavelength (2 pi / mu) | wavenumber (mu)", unit: "-", choices: [frequency, wavelength, wavenumber]}
  profile: {default: null, meaning: "gaussian | box", unit: "-", choices: [gaussian, box]}
  chart: {default: null, meaning: "the chart the width is in: log2 (octaves) | linear", unit: "-", choices: [log2, linear]}
  width: {default: null, meaning: "each member's FWHM (gaussian) or full width (box), in the chart", unit: "-"}
  gain: {default: null, meaning: "each member's peak amplitude g", unit: "-"}
  centres: {default: null, meaning: "the members' centres in the quantity's unit (or a grid: grid_from, grid_to, voices)", unit: "-"}
  grid_from: {default: null, meaning: "a grid's first centre", unit: "-"}
  grid_to: {default: null, meaning: "a grid's last centre (at most)", unit: "-"}
  voices: {default: null, meaning: "a grid's members per octave", unit: "-"}
  names: {default: null, meaning: "one name a member", unit: "-"}
  name: {default: null, meaning: "the stored selection's name", unit: "-"}

steps:
  before:
    - {node: select.kernels, with: {quantity: $quantity, profile: $profile, chart: $chart, width: $width, gain: $gain, centres: $centres, grid_from: $grid_from, grid_to: $grid_to, voices: $voices, names: $names}, out: kernels}

outputs:
  kernels: {kind: selection, type: kernels, name: $name, on: line}
