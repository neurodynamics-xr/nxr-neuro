# THE SPATIAL BAND BANK of a surface: one span [lambda_min, lambda_max) of the Laplace-Beltrami eigenvalue line (1/m^2) a level of the surface's tile ladder, code = the level. The level IS its Weyl band (Weyl's
# law on the ladder's mean piece area A: level l is [4 pi 2^(l-1) / A, 4 pi 2^l / A), level 0 from 0); a measurement's spatial band is its `within` key (`measure query --spatial-band L`). The eigenvalue
# line is 0 to 4.1e6 1/m^2 in steps of 1000 (wavelengths down to 3 mm). The ladder (`nxr-neuro run tiles`) comes first.
#
#   nxr-neuro run spatial_bands --dataset <folder> --subject sub-01 --surface cortex
pipeline: spatial_bands
version: 1
description: the spatial bands of a surface's tile ladder, spans on the eigenvalue line, one a level
scope: subject

inputs:
  surface: {manifold: surface, where: {name: $surface}}
  tiles:   {selection: ladder, manifold: surface.manifold.0, hint: "the surface's tile ladder (`nxr-neuro run tiles` first)"}

parameters:
  surface: {default: null, meaning: "the surface by name", unit: "-"}

steps:
  before:
    - {node: pyramid.spatial_bands, in: {tiles: tiles}, out: [eigenvalue, bank]}

outputs:
  eigenvalue:
    kind: manifold
    type: line
    name: Eigenvalue
  bank:
    kind: selection
    type: spans
    name: "{surface} spatial bands"
    on: eigenvalue
