# THE SPATIAL EVENTS' THRESHOLD, pass one (spec docs/specs/2026-11-14-spatial-events.md, decision 2, corrected 2026-11-14): the distribution of the relative band power OUTSIDE the bursts, a STATISTIC (counts in 4096 log bins), from which
# `run spatial_events` derives its threshold (the 99th percentile by default) by name. A vertex's single-frame relative power is about exponential, so a fixed ratio is exceeded by ~13.5 % of vertices on noise alone; the threshold is
# set instead by its FALSE-ALARM RATE, measured, as the time burst detector's threshold comes from the envelope's own distribution.
#
# THE CHAIN, the same as spatial_events' up to the relative power at the reference level (one linear map before any non-linear step, D106): analytic (Morlet) → frames (the frame tiling; NO `within`: the run's frames) → apply_kernel
# (no form; the hat at each of `levels` on the GLUED surface) → power → relative (÷ the stored baseline of `run spatial_baseline`, read by name) → at_level (the reference level) → estimate (method histogram). The good frames are the run
# LEAVING OUT the bursts (`outside`) and the bad segments (`exclude`). The histogram's range is fixed from the run's first 3000 good frames, counted from its first, so it does not depend on the chunk size. A cut of the run
# (`--from`/`--to`) cuts the distribution. `levels`, `reference_level`, `band`, `shape`, `tiling` and the baseline must be those `run spatial_events` is run with: it refuses a distribution of another chain.
#
#   nxr-neuro run spatial_threshold --dataset <folder> --subject sub-01 --band "8-12 Hz" --spatial-scales '["parts 4","parts 8","parts 16","parts 32","parts 64","parts 128","parts 256"]' --reference-scale "parts 64" --all
pipeline: spatial_threshold
version: 2
description: the distribution of the relative band power outside the bursts (4096 log bins), a statistic from which the spatial events' false-alarm threshold is read
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  kernel:    {operator: inverse kernel, from: recording.manifold.0, where: {name: $kernel, params.inverse.measure: $method}}
  tiles:     {selection: ladder, manifold: kernel.to, where: {name: "{surface} tiles"}, hint: "the surface's grid (`nxr-neuro run select_dyadic_surface` first)"}
  glued:     {manifold: surface, where: {name: $glued_surface}, hint: "the glued cortex (`nxr-neuro run glue` first): the computational manifold for spatiotemporal patterns"}
  grid:      {selection: any, manifold: recording.time, where: {name: "{recording} time grid frames ${band} ${frames_per_cycle} per cycle"}, hint: "the band's frame grid (`nxr-neuro run select_time_grid --rule frames --band 8-12Hz` first)"}
  bursts:    {selection: spans, manifold: recording.time, where: {name: $bursts}}
  baseline:  {statistic: mean, where: {name: $baseline_statistic}}
  bad:       {selection: spans, manifold: recording.time, where: {name: "{recording}_bad_segments"}, required: false}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  kernel: {default: none, meaning: "the inverse kernel's name, or none: found by `method` (the named kernel must also be of that method: --method)", unit: "-"}
  band: {default: "8-12 Hz", meaning: "the temporal band as a quantity (the frames and the time grid are resolved from it)", unit: Hz, chart: linear}
  shape: {default: morlet, meaning: "the temporal band's shape: morlet | meyer", unit: "-"}
  spatial_shape: {default: mexhat, meaning: "the spatial level's gain: mexhat | meyer", unit: "-"}
  spatial_scales: {default: ["parts 4", "parts 8", "parts 16", "parts 32", "parts 64", "parts 128", "parts 256"], meaning: "the scale space: one hat each, as quantities (parts per hemisphere, a tile diameter in mm, a wavelength in mm or a named scale); must be the baseline's", unit: mm, chart: wavelength}
  reference_scale: {default: "parts 64", meaning: "the scale whose relative power the patches are cut from (one of spatial_scales)", unit: mm, chart: wavelength}
  glued_surface: {default: null, meaning: "the glued cortex made by `run glue`, by name; results are restricted back to the original hemispheres", unit: "-"}
  method: {default: MNE, meaning: "the kernel's inverse method (its params.inverse.measure)", unit: "-"}
  transform: {default: auto, meaning: "the spatial band's transform: auto | eigen | chebyshev | exact", unit: "-"}
  modes: {default: 0, meaning: "when the eigenmodes are computed: the package's size; 0: the standard 3000, or more when the level needs it", unit: "modes"}
  order: {default: 0, meaning: "chebyshev degree; 0: the smallest of 40 to 5120 within `tolerance` of the band's gain", unit: "degree"}
  tolerance: {default: 0.01, meaning: "the largest difference between the band's gain and the chebyshev series that is accepted", unit: "fraction"}
  frames_per_cycle: {default: 36, meaning: "the frame density: frames to one cycle of the band's centre (the 10 degree step of phase work); the frame is the dyadic tile nearest it", unit: frames/cycle}
  frames_per_tile: {default: null, meaning: "the frame density per tile of the band instead (a power of two); wins over frames_per_cycle when given", unit: frames/tile}
  origin: {default: start, meaning: "the frames' origin as a point: start (the recording's first sample) | clock | event (a stored selection's first member)", unit: "-", choices: [start, clock, event]}
  bursts: {default: "global_bursts.bursts.{recording}", meaning: "the spans Selection the distribution LEAVES OUT (the bursts the events are cut inside)", unit: "-"}
  baseline_statistic: {default: "spatial_baseline.baseline.{recording}", meaning: "the stored baseline (`run spatial_baseline`), by name", unit: "-"}
  bad_segments: {default: exclude, meaning: "exclude | ignore the recording's bad spans", unit: "-"}
  bins: {default: 4096, meaning: "nxr `_core_threshold`", unit: "bins"}
  range_frames: {default: 3000, meaning: "the first good frames that fix the bins' range (nxr's chunk of 3000)", unit: "frames"}
  block_frames: {default: 256, meaning: "the frames binned at once (memory only: the result does not depend on it)", unit: "frames"}

steps:
  chunks:
    over: recording
    do:
      - {node: signal.analytic_frames, in: {x: recording, tiling: grid}, with: {band: $band, shape: $shape, frames_per_cycle: $frames_per_cycle, frames_per_tile: $frames_per_tile, origin: $origin}, out: z_frames}
      - {node: meeg.apply_kernel, in: {x: z_frames, kernel: kernel, tiles: tiles, glued: glued}, with: {spatial_scales: $spatial_scales, transform: $transform, modes: $modes, order: $order, tolerance: $tolerance, spatial_shape: $spatial_shape}, out: j}
      - {node: signal.field_form, in: {x: j}, with: {form: power}, out: p}
      - {node: measurement.relative, in: {x: p, baseline: baseline}, out: r}
      - {node: select.at_level, in: {x: r}, with: {scale: $reference_scale}, out: r_ref}
      - {node: measurement.estimate, in: {x: r_ref, exclude: bad, outside: bursts}, with: {method: histogram, bins: $bins, range_frames: $range_frames, block_frames: $block_frames, bad_segments: $bad_segments}, out: histogram}

outputs:
  histogram: {kind: statistic}
