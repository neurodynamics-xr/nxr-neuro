# THE MEASUREMENT PYRAMID of a recording's cortical current: a GRID on the product manifold cortex x time. Its cells are the joint partition (the Studio's D129) of the LEAVES of a surface's tile ladder
# (dyadic spatial tiles, one level: `<surface> tiles L<depth>`) and the FRAMES of the recording (the cycles of ONE tower level: `run frametiling`), code = (tile << bits) | frame. Every number stored is a
# MEASUREMENT over a member of that grid, per band: the band's analytic signal at the sensors (the block's spectrum x the band's gain, zero phase), through the kernel (J = K z: the inverse is linear, so the
# filter comes first), then per cell the sums power_sum (sum of area x |J|^2), envelope_sum (sum of area x |J|) and envelope_max (max |J|); a FREE-orientation kernel (3 rows a source) gives the Hermitian
# orientation tensor's ten sums in the surface's canonical frames instead. Only mergeable ingredients are stored (sums add, maxima merge): means, densities and every ratio are derived at read, and the
# coarser levels are the grids' closed-form hierarchy (tile code >> shift, tower code >> shift), never stored. The bands are the bank `atlas bands` (`run pyramid_bands`; a band's code is its index).
# The source estimate the sums are of is a Field with no bytes (its reductions ARE the pyramid, never K x itself); the good samples of each frame are `count` on the frame tiling.
#
#   nxr-neuro run tiles        --dataset <folder> --subject sub-01                       # the surface's tile ladder, once
#   nxr-neuro run frametiling  --dataset <folder> --subject sub-01 --recording rest --frame-level -18
#   nxr-neuro run pyramid_bands --dataset <folder> --subject sub-01                      # the band bank, once
#   nxr-neuro run pyramid      --dataset <folder> --subject sub-01 --recording rest --depth 5 --frame-level -18 --chunks 0
#
# What it cannot resolve: the minimum-norm current is smooth (its spatial resolution is the kernel's point-spread, not the leaves': a leaf finer than it carries no independent information); a band's
# analytic amplitude means something only for a band narrow against its centre; the filter is circular over the block, so the first and last `halo_seconds` of a recording carry its edge effect; a Morlet
# band overlaps its neighbours, so band powers do not add to broadband (`power_partition` does); a free kernel's principal axis is partly its own prior.
pipeline: pyramid
version: 1
description: the measurement pyramid of a recording's cortical current, band by band, as measurements over the cells of the joint grid (leaves x frames)
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  kernel:    {operator: inverse kernel, from: recording.manifold.0, where: {name: $kernel}}
  surface:   {manifold: surface, is: kernel.to}
  leaves:    {selection: set, manifold: kernel.to, where: {name: "{surface} tiles L${depth}"}, hint: "the surface's tile ladder at the leaves' level (`nxr-neuro run tiles` first)"}
  frames:    {selection: any, manifold: recording.time, where: {params.atlas.frame_level: $frame_level}, hint: "the recording's frame tiling at that tower level (`nxr-neuro run frametiling` first)"}
  bank:      {selection: spans, where: {name: "atlas bands"}, hint: "the pyramid's band bank (`nxr-neuro run pyramid_bands` first)"}
  canonical: {field: canonical frames, manifold: kernel.to, required: false, hint: "a free-orientation kernel's tensor is measured in the canonical frames (`nxr-neuro run frames` first)"}
  bad:       {selection: spans, manifold: recording.time, where: {name: "{recording}_bad_segments"}, required: false}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  kernel: {default: none, meaning: "the inverse kernel's name, or none: the subject's one inverse kernel on the recording's channels", unit: "-"}
  depth: {default: null, meaning: "the leaves' level of the surface's tile ladder (2^depth tiles a piece); the level every piece reaches is the finest the ladder holds", unit: level}
  frame_level: {default: -18, meaning: "the tower level of a frame (a frame lasts 86 400 x 2^level s: -18 is 0.33 s)", unit: level}
  bands: {default: [[1, 2], [2, 4], [4, 8], [8, 16], [16, 32], [32, 64]], meaning: "the bank [[lo, hi], ...] in Hz, each half open [lo, hi): nxr's DEFAULT_BANDS, the octaves 1-2 ... 32-64 Hz; the stored `atlas bands` must be this bank", unit: Hz}
  shape: {default: morlet, meaning: "the band filter: morlet (a Gaussian centred on (lo+hi)/2, FWHM hi-lo) | power_partition (nxr's bank: band powers add to broadband)", unit: "-", choices: [morlet, power_partition]}
  halo_seconds: {default: 8.0, meaning: "the context read on each side of a chunk for the filter (its circular edge effect lies inside it)", unit: s}
  block_samples: {default: 0, meaning: "samples projected through the kernel at a time (memory only: the result does not depend on it); 0: 512 for a fixed-orientation kernel, 128 for a free one", unit: samples}
  threads: {default: 0, meaning: "workers of the kernel products: 0 = the machine's performance cores, 1 = serial; the result is bit-identical for every count", unit: "-"}
  bad_segments: {default: exclude, meaning: "exclude = a sample in one of the recording's bad segments carries no current and no count | ignore = every sample counts", unit: "-", choices: [exclude, ignore]}

steps:
  before:
    - {node: joint.cells, in: {space: leaves, time: frames}, with: {layout: [band, tile, frame]}, out: [joint_space, cells]}
    - {node: pyramid.estimate, in: {kernel: kernel, frames: frames, leaves: leaves}, with: {bands: $bands, shape: $shape, halo_seconds: $halo_seconds}, out: estimate}
  chunks:
    over: recording
    do:
      - {node: pyramid.frame_samples, in: {x: recording, frames: frames, exclude: bad}, with: {bad_segments: $bad_segments}, out: count}
      - for: {band: $bands}
        do:
          - {node: pyramid.band_analytic, in: {x: recording, channels_of: kernel}, with: {band: $band, bands: $bands, shape: $shape, halo_seconds: $halo_seconds}, out: "z_{band}"}
          - {node: pyramid.band_sums, in: {z: "z_{band}", kernel: kernel, leaves: leaves, frames: frames, surface: surface, canonical: canonical, exclude: bad}, with: {band: $band, bands: $bands, block_samples: $block_samples, threads: $threads, bad_segments: $bad_segments}, out: "sums_{band}"}

outputs:
  joint_space:
    kind: manifold
    type: product
    factors: [surface.manifold.0, recording.time]
  cells:
    kind: selection
    type: cells
    name: "{recording} x {kernel} {surface} tiles L$depth x frame level $frame_level"
    on: joint_space
  estimate:
    kind: field
    kind_name: source estimate
    name: "{recording} x {kernel}"
    on: joint_space
    derived_from: recording
    by_operator: kernel
  count:
    kind: measurement
    over: frames
    of: estimate
  "sums_{band}":
    for: {band: $bands}
    kind: measurement
    over: cells
    of: estimate
    within: bank
