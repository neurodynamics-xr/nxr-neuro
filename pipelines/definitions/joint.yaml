# THE JOINT PARTITION OF SPACE x TIME (a closed-form set on the product of a surface and a recording's time line): the cells of a level of the surface's tile ladder and a level
# of the time line's constant-Q ladder, code = (tile << bits) | frame (the Studio atlas's layout); no element is stored. The surface's ladder (`nxr-neuro tiles`) and the time line's
# constant-Q ladder (`nxr-neuro constantq`) come first.
#
#   nxr-neuro run joint --dataset <folder> --subject sub-01 --recording rest --surface cortex --space-level 3 --time-level 4
pipeline: joint
version: 1
description: the joint cells of a surface level and a time level, closed form
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  surface:   {manifold: surface, where: {name: $surface}}
  space:     {selection: set, manifold: surface.manifold.0, where: {name: "{surface} tiles L${space_level}"}, hint: "the surface's tile ladder (`nxr-neuro tiles` first)"}
  time:      {selection: any, manifold: recording.time, where: {member_ordinal: $time_level}, hint: "the time line's constant-Q ladder (`nxr-neuro constantq` first)"}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  surface: {default: null, meaning: "the surface by name", unit: "-"}
  space_level: {default: null, meaning: "the level of the surface's tile ladder (0, 1, 2, ...)", unit: "level"}
  time_level: {default: null, meaning: "the level of the time line's constant-Q ladder (its member ordinal)", unit: "level"}
  name: {default: "{space} x {time} ({recording})", meaning: "the cells' name", unit: "-"}

steps:
  before:
    - {node: joint.cells, in: {space: space, time: time}, out: [joint_space, cells]}

outputs:
  joint_space:
    kind: manifold
    type: product
    factors: [surface.manifold.0, recording.time]
  cells:
    kind: selection
    type: cells
    name: $name
    on: joint_space
