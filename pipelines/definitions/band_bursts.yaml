# THE BURSTS OF A BAND, labelled on the recording's time axis (spec docs/specs/2026-11-13-time-events.md; the chain of docs/specs/2026-11-17-consolidation.md section 9.1). THE GRAPH:
#   recording -- field.form envelope (the band's amplitude) -- reduce {over: the time grid at the band's level} --> amplitude, envelope_max per tile (a measurement over a GRID)
#   -- summarize --> the baseline (median and robust SD per channel over the good tiles) -- select.events.spans (Rheome's rule: enter at median + 1.5 SD, extend while >= + 1.0 SD, join gaps, keep by
#   duration) --> the bursts (an IRREGULAR selection, detected over the grid; each member described by its centre and extent) -- reduce {over: the bursts} --> each burst's amplitude, peak, duration,
#   interval -- summarize --> the statistics across the bursts (a `summary`, never a per-member statistic).
# The band is a QUANTITY (Hz): the time grid's level is resolved from it in closed form (the Studio's `fitLevelOf`: the first 2^k samples holding 4 cycles of the band's centre) and recorded with the
# snapped tile length; the grid is the line's one stored `<recording> time grid` (`run select_time_grid`, once). The filters of the bursts are quantities in physical units: a duration range, a gap to join.
# Stored: the tile measurements, the baseline, the bursts, the bursts' measurements and their statistics.
#
#   nxr-neuro run select_time_grid --dataset <folder> --subject sub-01 --recording rest                # the line's time grid, once
#   nxr-neuro run band_bursts --dataset <folder> --subject sub-01 --all                                # alpha (8-16 Hz), the whole recording
#   nxr-neuro run band_bursts --dataset <folder> --subject sub-01 --band "4-8 Hz" --all                # theta's tile
pipeline: band_bursts
version: 2
description: the bursts of a band on the recording's time axis, from the band's amplitude per tile of its time grid level
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  grid:      {selection: any, manifold: recording.time, where: {name: "{recording} time grid"}, hint: "the line's time grid (`nxr-neuro run select_time_grid` first)"}
  bad:       {selection: spans, manifold: recording.time, where: {name: "{recording}_bad_segments"}, required: false}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  band: {default: "8-16 Hz", meaning: "the band as a quantity: its time level is resolved from it; alpha at the hertz anchor", unit: Hz, chart: linear}
  shape: {default: morlet, meaning: "the temporal band's shape: morlet | meyer (compact edges: bands that add up)", unit: "-"}
  combine: {default: each, meaning: "each: per channel (detect.spindle) | mean: one trace, the mean over channels", unit: "-"}
  enter_sd: {default: 1.5, meaning: "robust SDs above the median to enter (labelalpha's hiSD)", unit: "robust SD"}
  exit_sd: {default: 1.0, meaning: "robust SDs above the median to extend a burst (labelalpha's loSD)", unit: "robust SD"}
  gap: {default: "0.1 s", meaning: "gaps up to this are joined", unit: s, chart: clock}
  duration: {default: ">=0.4 s", meaning: "the bursts kept, by duration: a range (\"0.4-2 s\") or a lower bound (\">=0.4 s\"); a filter in cycles is a duration in the band's chart (\">=3 cycles\")", unit: s, chart: clock}
  bad_segments: {default: exclude, meaning: "exclude | ignore the recording's bad spans", unit: "-"}
  burst_summaries: {default: [count, sum, median, mean, sd, "percentile:25", "percentile:75", "percentile:90"], meaning: "the statistics across the bursts, per measurement", unit: "-"}

steps:
  chunks:
    over: recording
    do:
      - {node: envelope, in: {x: recording}, with: {band: $band, shape: $shape}, out: amp}
      - {node: reduce, in: {x: amp, over: grid, exclude: bad}, with: {at: $band, measures: [amplitude, envelope_max], bad_segments: $bad_segments}, out: tiles}
  after:
    - {node: summarize, in: {x: tiles}, with: {summaries: [median, mad], combine: $combine, of: amplitude}, out: baseline}
    # the bursts: an irregular selection detected over the grid
    - {node: select.events.spans, in: {x: tiles, baseline: baseline}, with: {measure: amplitude, combine: $combine, enter_sd: $enter_sd, exit_sd: $exit_sd, gap: $gap, duration: $duration}, out: bursts}
    # PER BURST: a measurement over the bursts, by merging the tile measurements they cover (the members' own: duration, interval_next)
    - {node: reduce, in: {x: tiles, over: bursts}, with: {measures: [amplitude, envelope_max, duration, interval_next]}, out: burst_values}
    # ACROSS THE BURSTS: the statistics of each (the span's good seconds recorded, so rate, occupancy and CV are derived at read)
    - {node: summarize, in: {x: burst_values}, with: {summaries: $burst_summaries, combine: $combine}, out: burst_stats}

outputs:
  tiles:        {kind: measurement, over: grid, of: recording}
  baseline:     {kind: statistic, of: tiles}
  bursts:       {kind: spans, types: [burst], detected_over: grid}
  burst_values: {kind: measurement, over: bursts, of: recording}
  burst_stats:  {kind: statistic, of: burst_values}
