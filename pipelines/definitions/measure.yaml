# THE ONE MEASURING DEFINITION (version 2): a FIELD (a stored one by name, OR a field chain composed in) REDUCED over the members of a SELECTION (a stored one by name, OR made in the run by a maker), by the measures of
# the registry, into one MEASUREMENT over the members (the table `selection_measurement`, array-backed). The four operations are one implementation each (spec docs/specs/2026-11-17-consolidation.md section 2): `reduce`
# (this definition), `roll_up` (the step `after`, when `to` is given, and the definition `roll_up`), `summarize` (when `summaries` is given, and the definition `summarize`), `estimate` (the Welch family).
#
# THE FIELD. Exactly one of `field` / `chain`: a stored field by name, or a field chain (`band_analytic`, `cortical_band`, `member_activation`, `band_outer`) composed into the run (nothing stored, its name and resolved
# parameters in the cache key). THE SELECTION. Exactly one of `over` / `make`: a stored selection by name, or a maker (`select.dyadic_surface`, `select.time_grid`, `select.bands`, `select.product`, `select.events.*`)
# composed in; a maker composed in stores its selection get-or-create. Both given, or neither, is refused with the reason.
#
# THE FORM of the field each measure reads (magnitude, power, phase_current, outer, none) is the pointwise node `field.form`, inserted from the measures registry (`io/schema/measures.json`: the form, the ingredient, the
# merge rule). The measures are additive INGREDIENTS (count, weight, sum, sum_sq, max, min, abs_max): ratios (amplitude = sum / weight, sd, speed, travelling index) are derived at read, never reduced.
# THE WEIGHT is stated, never assumed: none (1 a vertex), barycentric (a third of each incident triangle), voronoi (the mixed Voronoi area of the mollified input). On a real cortex they differ by tens of percent.
# THE BAD SEGMENTS: members lose samples, never a factor. A band SET with a coupled product makes one product and one measurement per band member, in one pass; several (band x spatial scale) pairs are several plans of
# one run (each cached on its own).
#
# PRESETS are ONLY named parameter sets (below). Provenance records the preset's name; the CACHE KEY holds only the resolved parameters, so two presets with equal parameters are one cached result.
#
#   nxr-neuro run measure --dataset <folder> --subject sub-01 --field rest_psd_alpha --over "cortex tiles" --weight barycentric --measures '["mean","max"]'
#   nxr-neuro run measure --dataset <folder> --subject sub-01 --recording rest --set cortical_band_cells --band "8-16 Hz" --spatial-scale "wavelength 40 mm" --all
pipeline: measure
version: 2
description: a field (stored, or a field chain composed in) reduced over the members of a selection (stored, or made by a maker), by registry measures, into one measurement
scope: subject

inputs:
  field:   {field: any, each: true, where: {name: $field}, chain: $chain, chain_parameters: $chain_parameters, hint: "a stored field by name (--field), OR a field chain composed in (--chain)"}
  over:    {selection: any, where: {name: $over}, make: $make, hint: "a stored selection by name (--over), OR one made in the run by a maker (--make)"}
  weights: {field: any, required: false, where: {name: $weights}}
  line:    {manifold: line, is: field.time, required: false, hint: "the field's time line (what a maker of the run's span reads: a `before` node reads arrays, never the streamed field)"}
  space:   {manifold: any, is: field.manifold.0, required: false, hint: "the field's first manifold (what a maker of its elements reads: the channels, the vertices)"}
  tiles:   {selection: ladder, manifold: field.manifold.0, when: $spatial_scale, hint: "the surface's grid whose level the spatial scale is (`nxr-neuro run select_dyadic_surface` first); absent without a spatial scale"}
  bad:     {selection: spans, manifold: field.time, where: {name: "{field}_bad_segments"}, required: false}

parameters:
  field: {default: null, meaning: "a stored field, by name (a scalar or hermitian3 map on a surface; `nxr-neuro run surface_frames` first for hermitian3 and gradients)", unit: "-"}
  chain: {default: null, meaning: "a field chain composed in: band_analytic | cortical_band | member_activation | band_outer (exactly one of field, chain)", unit: "-"}
  chain_parameters: {default: null, meaning: "the chain's parameters, as quantities (bands, spatial_scale, shape, ...)", unit: "-"}
  over: {default: null, meaning: "a stored selection by name: any of the five types, any family (exactly one of over, make)", unit: "-"}
  make: {default: null, meaning: "a maker composed in: {node: select.*, ...} with its parameters as quantities", unit: "-"}
  recording: {default: none, meaning: "the recording's name when the field is a chain over a recording, or none: every recording of the subject, one run each", unit: "-"}
  measures: {default: null, meaning: "the measures per member, from the registry (no default: the caller's or the preset's): mean, sum, mean_square, max, min, abs_max, count, median (weight none only), amplitude, envelope_max, power, phase_current, outflow, circulation, levi_civita, tensor_*, gradient_*, and the members' own area, n_elements, duration, centre, path_length", unit: "-"}
  weight: {default: null, meaning: "how the elements of a member are weighted: none | barycentric | voronoi (it changes the numbers, so it is always stated)", unit: "-", choices: [none, barycentric, voronoi]}
  weights: {default: null, meaning: "a stored per-element weight field by name (area, mass), when `weight` is given", unit: "-"}
  bad_segments: {default: exclude, meaning: "exclude = a sample in one of the recording's bad segments carries no value and no count | ignore = every sample counts", unit: "-", choices: [exclude, ignore]}
  band: {default: null, meaning: "ONE temporal band as a quantity (\"8-16 Hz\") for the presets that make a chain and a time grid of it (a band SET stays a selection, `over`)", unit: Hz, chart: linear}
  spatial_scale: {default: null, meaning: "the spatial band as a quantity (a tile diameter, `wavelength 40 mm`, `parts 16`, an eigenvalue): the level of the surface's grid the presets couple to", unit: mm, chart: wavelength}
  channels: {default: null, meaning: "a stored cross-spectrum's name: the presets that read the sensors' analytic signal use ITS channels only; null: every channel", unit: "-"}
  duration: {default: null, meaning: "the time tiles of the presets that tile the run: a duration as a quantity (\"1 s\"), snapped to 2^k samples", unit: s, chart: clock}
  form: {default: null, meaning: "the pointwise form read before the reduction, for a complex or vector field (the registry's form of the measures asked: magnitude for amplitude / envelope_max, power for power, phase_current for the current's measures); null: the field is reduced as it is (a real quantity)", unit: "-", choices: [null, magnitude, power, phase_current]}
  rolled_to: {default: null, meaning: "roll the measurement up to a coarser level of its grid, stated as a quantity (a tile diameter, a duration, pieces, whole), merged by each measure's rule; null: stored at the grid's own level", unit: mm, chart: diameter}
  summaries: {default: null, meaning: "also summarise across the members: mean, sd, median, mad, percentile:P, min, max, skewness, kurtosis, peak, count; null: none", unit: "-"}
  combine: {default: each, meaning: "summaries: each = per row | pool = the rows pooled | mean = the mean of the rows' summaries", unit: "-", choices: [each, pool, mean]}
  name: {default: null, meaning: "the stored measurement's name; null: derived from the field and the selection", unit: "-"}

presets:
  # a field of a stored selection (today's `measure`): the default is a stored field and a stored partition. The presets that COMPOSE take their band and spatial scale as quantities: `--band "8-16 Hz" --spatial-scale "parts 16"`.
  # A product's factors are Selections made by makers (the run's span, a channel set, a time grid) or found (`tiles`, the surface's grid); the spatial factor's level is COUPLED to the stated scale in closed form.
  cortical_band_cells:
    chain: cortical_band
    chain_parameters: {recording: $recording, band: $band, spatial_scale: $spatial_scale}
    make:
      node: select.product
      name: "{field_recording} cells ${band} ${spatial_scale}"
      with: {couple: [{factor: 0, scale: $spatial_scale}]}
      factors:
        - {input: tiles}
        - {node: select.time_grid, in: {line: line}, with: {rule: band, band: $band}, name: "{field_recording} time grid band ${band}"}
    form: magnitude
    measures: [amplitude, envelope_max]
    weight: barycentric
  cortical_band_cells_power:
    chain: cortical_band
    chain_parameters: {recording: $recording, band: $band, spatial_scale: $spatial_scale}
    make:
      node: select.product
      name: "{field_recording} cells ${band} ${spatial_scale}"
      with: {couple: [{factor: 0, scale: $spatial_scale}]}
      factors:
        - {input: tiles}
        - {node: select.time_grid, in: {line: line}, with: {rule: band, band: $band}, name: "{field_recording} time grid band ${band}"}
    form: power
    measures: [power]
    weight: barycentric
  cortical_band_cells_current:
    chain: cortical_band
    chain_parameters: {recording: $recording, band: $band, spatial_scale: $spatial_scale}
    make:
      node: select.product
      name: "{field_recording} cells ${band} ${spatial_scale}"
      with: {couple: [{factor: 0, scale: $spatial_scale}]}
      factors:
        - {input: tiles}
        - {node: select.time_grid, in: {line: line}, with: {rule: band, band: $band}, name: "{field_recording} time grid band ${band}"}
    form: phase_current
    measures: [phase_current]
    weight: barycentric
  # the atlas layout: the band's frames (36 to a cycle) joint with the spatial tiles at the scale, the tensors of the current
  cortical_band_pyramid:
    chain: cortical_band
    chain_parameters: {recording: $recording, band: $band, spatial_scale: $spatial_scale}
    make:
      node: select.product
      layout: joint
      name: "{field_recording} atlas ${band} ${spatial_scale}"
      with: {couple: [{factor: 0, scale: $spatial_scale}]}
      factors:
        - {input: tiles}
        - {node: select.time_grid, in: {line: line}, with: {rule: frames, band: $band}, name: "{field_recording} time grid frames ${band}"}
    form: power
    measures: [count, power]
    weight: barycentric
  sensor_band_amplitude:
    chain: band_analytic
    chain_parameters: {recording: $recording, band: $band}
    make:
      node: select.product
      name: "{field_recording} sensor tiles ${band}"
      factors:
        - {node: select.time_grid, in: {line: line}, with: {rule: band, band: $band}, name: "{field_recording} time grid band ${band}"}
        - {node: select.elements, in: {space: space}, with: {as: members}, name: "{field_recording} channels"}
    form: magnitude
    measures: [amplitude, envelope_max]
    weight: none
  # the band's analytic cross-spectrum in time tiles of the band: the sum of z z^H over a tile (the windows of the Wishart null)
  analytic_cross_spectrum_tiles:
    chain: band_outer
    chain_parameters: {recording: $recording, band: $band, channels: $channels}
    make: {node: select.time_grid, in: {line: line}, with: {rule: band, band: $band}, store: {type: tiling, on: line.manifold.0, name: "{field_recording} time grid band ${band}"}}
    measures: [sum]
    weight: none
  # the mean of each channel over the whole run: a product of the run's span (ONE member) and the channels (each its own member), both Selections made by makers in the run and stored (--field is the recording)
  channel_span_mean:
    make:
      node: select.product
      name: "{field} run span x channels"
      factors:
        - {node: select.run_span, in: {line: line}, name: "{field} run span"}
        - {node: select.elements, in: {space: space}, with: {as: members}, name: "{field} channels"}
    measures: [mean]
    weight: none
    name: "{field}_channel_mean"
  # the data's band power in time tiles, on the channels of a stored cross-spectrum (`channels`), the channels one member: what the lag-free surrogates scale their draws to
  surrogate_lagfree_envelope:
    chain: band_analytic
    chain_parameters: {recording: $recording, band: $band, channels: $channels}
    make:
      node: select.product
      name: "{field_recording} envelope tiles ${duration}"
      factors:
        - {node: select.time_grid, in: {line: line}, with: {rule: tiles, duration: $duration}, name: "{field_recording} time grid tiles ${duration}"}
        - {node: select.elements, in: {space: space}, with: {as: one_member}, name: "{field_recording} channels one member"}
    form: power
    measures: [power]
    weight: none
  # the largest amplitude of the flow's input over the run, per vertex of the cortex rolled to the whole: give the chain's parameters (family, gain, freq, ...) as `chain_parameters`
  flow_max_amplitude:
    chain: member_activation
    make:
      node: select.product
      name: "{field_recording} run span x cortex"
      factors:
        - {node: select.run_span, in: {line: line}, name: "{field_recording} run span"}
        - {node: select.elements, in: {space: space}, with: {as: members}, name: "{field_recording} cortex"}
    form: magnitude
    measures: [envelope_max]
    weight: none
    rolled_to: whole
  psd_channel_mean:
    field: psd
    make: {node: select.product, factors: [{set: channels, as: one_member}]}
    measures: [mean]

steps:
  chunks:
    over: field
    do:
      - {node: signal.field_form, in: {x: field}, with: {form: $form}, out: shaped, when: $form}
      - {node: measurement.reduce, in: {x: shaped, over: over, exclude: bad, weights: weights}, with: {measures: $measures, weight: $weight, bad_segments: $bad_segments}, out: [values, ingredients], when: $form}
      - {node: measurement.reduce, in: {x: field, over: over, exclude: bad, weights: weights}, with: {measures: $measures, weight: $weight, bad_segments: $bad_segments}, out: [values, ingredients], when: "!$form"}
  after:
    - {node: measurement.roll_up, in: {x: ingredients}, with: {to: $rolled_to}, out: [rolled, rolled_ingredients], when: $rolled_to}
    - {node: measurement.summarize, in: {x: values}, with: {summaries: $summaries, combine: $combine}, out: statistics, when: $summaries}

outputs:
  values:     {kind: measurement, over: over, of: field, name: $name}
  rolled:     {kind: measurement, over: over, of: field, when: $rolled_to}
  statistics: {kind: statistic, of: values, when: $summaries}
