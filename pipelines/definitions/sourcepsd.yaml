# THE BAND POWER OF A RECORDING'S SOURCES (a statistic): the channels' cross-spectral density per band (Welch, streamed chunk by chunk, the segments carried across chunk
# edges, the recording's bad segments left out), then diag(K Re(S) K^T) through the inverse kernel K, the orientations' power summed: exactly Welch run on K x, at the cost of
# channels^2 per band. With normalisation relative, each band over the source's total power (all bins). Brainstorm's band power of sources is the reference.
# Stored: the statistic `<recording>_<kernel>_psd` (measure power_density, relative_power or power, by welch, OF the recording; axes vertex (the kernel's target) x band (its
# entries named)), and its segment partition `<name>_segments`.
#
#   nxr-neuro run sourcepsd --dataset <folder> --subject sub-01 --recording rest --all [--kernel NAME] [--normalisation relative] [--set brainstorm]
pipeline: sourcepsd
version: 1
description: the band power of a recording's sources through an inverse kernel, per band
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  kernel:    {operator: inverse kernel, from: recording.manifold.0, where: {name: $kernel}}
  bad:       {selection: spans, manifold: recording.time, where: {name: "{recording}_bad_segments"}, required: false}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  kernel: {default: none, meaning: "the inverse kernel's name, or none: the subject's one inverse kernel on the recording's channels", unit: "-"}
  name: {default: "{recording}_{kernel}_psd", meaning: "the stored statistic's name; its segment partition is <name>_segments", unit: "-"}
  bands: {default: [{name: delta, lo: 2, hi: 4}, {name: theta, lo: 5, hi: 7}, {name: alpha, lo: 8, hi: 12}, {name: beta, lo: 15, hi: 29}, {name: gamma1, lo: 30, hi: 59}, {name: gamma2, lo: 60, hi: 90}], meaning: "the bands: {name, lo, hi}; a band holds the bins from lo to hi inclusive (Brainstorm's default bands)", unit: "Hz"}
  normalisation: {default: none, meaning: "none = the band power | relative = each band over the source's total power (all bins)", unit: "-", choices: [none, relative]}
  segment_seconds: {default: 4.0, meaning: "the segment's length in seconds (under segment_rule tile it snaps to the nearest 2^k samples)", unit: "s"}
  segment_samples: {default: null, meaning: "the segment's length in samples (wins over segment_seconds); null: from segment_seconds", unit: "samples"}
  segment_level: {default: null, meaning: "under segment_rule tile: the segment is 2^segment_level samples; null: from segment_seconds", unit: "level"}
  segment_rule: {default: tile, meaning: "how the segment's length becomes samples: tile | round | even", unit: "-", choices: [tile, round, even]}
  overlap: {default: 0.5, meaning: "the fraction of a segment shared with the next, in [0, 1)", unit: "fraction"}
  window: {default: hamming, meaning: "the taper of each segment", unit: "-", choices: [hann, hamming, blackman, rectangular]}
  periodic: {default: false, meaning: "the DFT-even form of the window rather than the symmetric one", unit: "-"}
  detrend: {default: constant, meaning: "what is removed from each segment before windowing", unit: "-", choices: [none, constant, linear]}
  scaling: {default: density, meaning: "density = power per Hz | spectrum = power | chain = per sample, per bin", unit: "-", choices: [density, spectrum, chain]}
  bad_segments: {default: exclude, meaning: "exclude = a segment touching one of the recording's bad segments is left out | ignore = every segment is kept", unit: "-", choices: [exclude, ignore]}

presets:
  tiles:      {segment_rule: tile}
  brainstorm: {segment_rule: round, window: hamming, periodic: false, detrend: constant, scaling: density}
  scipy:      {segment_rule: round, window: hann, periodic: true, detrend: constant, scaling: density}

steps:
  chunks:
    over: recording
    do:
      - {node: welch.source_band_power, in: {x: recording, kernel: kernel, exclude: bad}, with: {bands: $bands, normalisation: $normalisation, segment_seconds: $segment_seconds, segment_samples: $segment_samples, segment_level: $segment_level, segment_rule: $segment_rule, overlap: $overlap, window: $window, periodic: $periodic, detrend: $detrend, scaling: $scaling, bad_segments: $bad_segments}, out: power}

outputs:
  power:
    kind: statistic
    name: $name
    of: recording
    axes: [{name: vertex, on: kernel.to}, {name: band}]
    partition: {tiling: "$name_segments", on: recording.time}
