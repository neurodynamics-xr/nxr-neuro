# QUADRATURE PER CELL AND PER BURST: travelling or standing? From a band's analytic cross-spectrum on time tiles (`nxr-neuro run measure --set analytic_cross_spectrum_tiles`), the kernel and the joint cells, per spatial tile
# of a level T = B C B^T (B the tile's rows of the kernel with the level's Weyl band, all components; C a time tile's cross-spectrum on the kernel's channels), stored as the two additive
# ingredients sum |T|^2 and sum |Im T|^2 (the quadrature fraction is derived at read): per time tile of the joint cells, and per burst (C summed over the burst's tiles first: products add). With
# tile_pairs also the cross-tile blocks of the level's touching tiles (nxr::ladder::tileAdjacency order): a wave running from one tile into the next is there, not in the within-tile blocks.
# The tile level of the cross-spectrum must equal the joint cells' time level.
#
#   nxr-neuro run cellquadrature --dataset <folder> --subject sub-01 --recording rest --cross-spectrum rest_crossspectrum_alpha_windows --joint "cortex tiles x frames (rest)" --spatial-scale "parts 8" --bursts "rest alpha bursts"
pipeline: cellquadrature
version: 2
description: the quadrature ingredients per spatial tile (and tile pair), per time tile and per burst, from an analytic cross-spectrum
scope: subject

inputs:
  cross_spectrum: {statistic: any, where: {name: $cross_spectrum}}
  recording:      {field: recording, where: {name: $recording}}
  kernel:         {operator: inverse kernel, where: {name: $kernel}}
  joint:          {selection: set, where: {name: $joint}, hint: "the joint cells of the surface's level and the cross-spectrum's tile level (`nxr-neuro run select_product` first, or composed by `run measure`)"}
  bursts:         {selection: spans, manifold: recording.time, where: {name: $bursts}, required: false}

parameters:
  cross_spectrum: {default: null, meaning: "the analytic cross-spectrum's name (<name>_<band>_windows)", unit: "-"}
  recording: {default: null, meaning: "the recording the cross-spectrum is of (the measurements are of it)", unit: "-"}
  kernel: {default: none, meaning: "the inverse kernel's name (free or fixed orientation), or none: the subject's one inverse kernel", unit: "-"}
  joint: {default: null, meaning: "the joint cells' name (its time level is the cross-spectrum's tile level)", unit: "-"}
  bursts: {default: null, meaning: "a spans selection of bursts on the recording's time line: also made per burst; null: the cells only", unit: "-"}
  spatial_scale: {default: null, meaning: "the spatial band as a quantity: a tile diameter, a wavelength, parts per hemisphere or a named scale; its Weyl band is the spatial band, its tiles the spatial partition", unit: mm, chart: wavelength}
  weights: {default: area, meaning: "area = the vertices count by the area they stand for (barycentric) | none = every vertex counts equally", unit: "-", choices: [area, none]}
  tile_pairs: {default: true, meaning: "also the cross-tile blocks of the level's touching tiles", unit: "-"}
  transform: {default: auto, meaning: "the spatial band's transform: auto (eigenmodes first, chebyshev an announced fallback) | eigen | chebyshev | exact", unit: "-"}
  modes: {default: null, meaning: "the eigenmodes made when the package is computed; null: the standard", unit: "-"}
  order: {default: null, meaning: "the Chebyshev order; null: from the tolerance", unit: "-"}
  tolerance: {default: null, meaning: "the Chebyshev tolerance; null: the default", unit: "-"}

steps:
  before:
    - {node: cellquadrature, in: {cross_spectrum: cross_spectrum, recording: recording, kernel: kernel, joint: joint, bursts: bursts}, with: {spatial_scale: $spatial_scale, weights: $weights, tile_pairs: $tile_pairs, transform: $transform, modes: $modes, order: $order, tolerance: $tolerance}, out: [cells, cell_pairs, bursts_q, burst_pairs]}

outputs:
  cells:
    kind: measurement
    name: "cellquadrature.{cross_spectrum}.{joint}"
    over: joint
    of: recording
  cell_pairs:
    kind: measurement
    name: "tilepairs.{cross_spectrum}.{joint}"
    over: joint
    of: recording
  bursts_q:
    kind: measurement
    name: "cellquadrature.{cross_spectrum}.{bursts}"
    over: bursts
    of: recording
  burst_pairs:
    kind: measurement
    name: "tilepairs.{cross_spectrum}.{bursts}"
    over: bursts
    of: recording
