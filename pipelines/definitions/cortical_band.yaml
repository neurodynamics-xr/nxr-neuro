# A FIELD CHAIN (`kind: chain`): the recording's band read on the CORTEX through the inverse kernel, with the SPATIAL band folded into the kernel once (M = (F (x) I) K in preparation: a linear map reads the chain before
# any non-linear step, D106). ONE pointwise field, no reduction and no detection: the field `cortex x members(bands) x T` (or x frames of a frame grid), complex, vector3 for a free kernel or scalar for a fixed one.
# Run alone it stores the field; composed into `measure` (input `chain: cortical_band`) its steps are inlined, nothing stored, its provenance in the consumer's cache key.
#
# THE GRAPH:  recording -- band_analytic (composed) -- apply_kernel {spatial_scale} --> field<cortex x members(bands) x T; complex>
# The kernel's surface is the caller's (rule 19): the two-hemisphere surface of record, or the glued surface made by `glue` (the default computational manifold for spatiotemporal patterns, rule 33) named as the kernel's
# target; results are restricted back to the original hemispheres for storage, export and figures.
#
# TRANSFORM ROUTE. `auto` (the stored eigenmodes first; made, with a message, when absent; Chebyshev the announced fallback) | `eigen` | `chebyshev` | `exact` (dense, at most 4096 vertices).
# ENVELOPE. `temporal` = |z| of the band-passed field (signed lobes: |z| dips to 0 where lobes of opposite sign meet) | `spatiotemporal` = the monogenic amplitude sqrt(|z|^2 + |R z|^2), R the band's Riesz part.
#
# What it cannot resolve: the minimum-norm current is smooth (its spatial resolution is the kernel's point-spread, not the grid's); a free kernel's principal axis is partly its own prior.
#
#   nxr-neuro run cortical_band --dataset <folder> --subject sub-01 --recording rest --bands "frequency bands" --spatial-scale "wavelength 40 mm" --all
pipeline: cortical_band
kind: chain
version: 1
description: a recording's band read on the cortex through the inverse kernel with the spatial band folded in, a pointwise complex field cortex x bands x time
scope: subject
one_of: [band, bands]

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  kernel:    {operator: inverse kernel, from: recording.manifold.0, where: {name: $kernel, params.inverse.measure: $method}}
  z:         {field: analytic signal, chain: band_analytic, chain_parameters: {recording: "{recording}", band: $band, bands: $bands, shape: $shape, halo: $halo}, hint: "composed in: the recording's analytic signal in the band set (one transform a block shared by all bands)"}
  grid:      {selection: ladder, manifold: kernel.to, when: $spatial_scale, hint: "the surface's grid, whose level the spatial scale is (`nxr-neuro run select_dyadic_surface` first); absent when there is no spatial scale"}
  glued:     {manifold: surface, where: {name: $glued_surface}, required: false, hint: "the glued cortex made by `nxr-neuro run glue`, by name (rule 33): the field is made on it and restored to the original hemispheres for storage"}
  canonical: {field: canonical frames, manifold: kernel.to, required: false, hint: "a free-orientation kernel's tensor is read in the canonical frames (`nxr-neuro run surface_frames` first)"}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  kernel: {default: none, meaning: "the inverse kernel's name, or none: found by `method`", unit: "-"}
  method: {default: MNE, meaning: "the kernel's inverse method (its params.inverse.measure)", unit: "-"}
  bands: {default: null, meaning: "the temporal band SET, by name (a member per band). Exactly one of band, bands", unit: "-"}
  band: {default: null, meaning: "ONE temporal band as a quantity (\"8-16 Hz\"). Exactly one of band, bands", unit: Hz, chart: linear}
  glued_surface: {default: null, meaning: "the glued cortex (the derived manifold made by `glue`) by name; null: the surface of record, no bridge", unit: "-"}
  shape: {default: morlet, meaning: "the temporal band's shape: morlet | power_partition (nxr's bank: the band powers add to broadband)", unit: "-", choices: [morlet, power_partition]}
  spatial_shape: {default: mexhat, meaning: "the spatial band's gain: mexhat | meyer (the scale IS its Weyl band: compact edges)", unit: "-", choices: [mexhat, meyer]}
  spatial_scale: {default: null, meaning: "the spatial band as a quantity: a tile diameter (20 mm), a wavelength (wavelength 40 mm), an eigenvalue (eigenvalue 1/m2) or a named scale; resolved to the grid's level by space_level_of_band; null: no spatial band (the kernel as it is)", unit: mm, chart: wavelength}
  transform: {default: auto, meaning: "the spatial band's route: auto (eigenmodes first, made when absent, said; chebyshev the announced fallback) | eigen | chebyshev | exact", unit: "-", choices: [auto, eigen, chebyshev, exact]}
  envelope: {default: temporal, meaning: "temporal = |z| of the band-passed field | spatiotemporal = the monogenic amplitude (another recipe: a rerun of the other envelope needs --replace)", unit: "-", choices: [temporal, spatiotemporal]}
  form: {default: none, meaning: "the pointwise form read on the field: none (the complex field) | curl_tan (the tangential curl, for vortex cores) | div_tan | normal", unit: "-", choices: [none, curl_tan, div_tan, normal]}
  modes: {default: 0, meaning: "when the eigenmodes are made: the package's size; 0: the standard 3000, or more when the scale needs it", unit: modes}
  order: {default: 0, meaning: "chebyshev degree; 0: the smallest of 40 to 5120 within `tolerance` of the band's gain", unit: degree}
  tolerance: {default: 0.01, meaning: "the largest difference between the band's gain and the chebyshev series that is accepted", unit: fraction}
  halo: {default: 8.0, meaning: "the context read on each side of a chunk for the filter", unit: s, chart: clock}

steps:
  chunks:
    over: recording
    do:
      - {node: meeg.apply_kernel, in: {x: z, kernel: kernel, tiles: grid, glued: glued}, with: {spatial_scale: $spatial_scale, transform: $transform, modes: $modes, order: $order, tolerance: $tolerance, spatial_shape: $spatial_shape, envelope: $envelope, form: $form}, out: sources, when: $spatial_scale}
      - {node: meeg.apply_kernel, in: {x: z, kernel: kernel, glued: glued}, with: {transform: $transform, modes: $modes, order: $order, tolerance: $tolerance, spatial_shape: $spatial_shape, envelope: $envelope, form: $form}, out: sources, when: "!$spatial_scale"}

outputs:
  sources: {kind: field, kind_name: source estimate, name: "{recording} x {kernel} bands", on: kernel.to, derived_from: recording, by_operator: kernel}
