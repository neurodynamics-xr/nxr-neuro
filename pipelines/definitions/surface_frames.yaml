# THE FRAMES OF A SURFACE: the canonical frames (north e1, west e2 = n x e1, n outward) pushed forward from the registered sphere `<surface>_sphere` when they are not stored yet,
# their singular vertices (the poles, ill-conditioned push-forwards) and the angle of north in geometry-central's gauge (with its gauge record); and the anatomical frame, from the
# surface's own axes in the stated convention or carried from a template subject's through the registered spheres: the angle from north to anterior, which way the second axis
# points (0 superior, 1 medial) and its sign, and the vertices where it is reliable (the anterior axis projects on the tangent plane with at least min_projection).
#
#   nxr-neuro run surface_frames --dataset <folder> --subject sub-01 --surface cortex [--template fsaverage --template-surface cortex_pial]
pipeline: surface_frames
version: 1
description: a surface's canonical frames (from its registered sphere) and its anatomical frame
scope: subject

inputs:
  surface: {manifold: surface, where: {name: $surface}}

parameters:
  surface: {default: null, meaning: "the surface by name", unit: "-"}
  template: {default: null, meaning: "a template subject of the dataset whose anatomical frame is carried through the registered spheres; null: the surface's own axes", unit: "-"}
  template_surface: {default: null, meaning: "the template's surface; null: its primary one", unit: "-"}
  convention: {default: scs, meaning: "the coordinates the surface's own axes are in: scs (anterior +x, left +y, superior +z) | ras", unit: "-", choices: [scs, ras]}
  side: {default: auto, meaning: "a one-piece surface's hemisphere: auto (each piece by position) | left | right", unit: "-", choices: [auto, left, right]}
  min_projection: {default: 0.34, meaning: "reliable where the anterior axis projects on the tangent plane with at least this length (sin 20 degrees)", unit: "-"}
  max_condition: {default: 50.0, meaning: "canonical frames: a vertex whose push-forward Jacobian is worse is singular", unit: "-"}

steps:
  before:
    - {step: surface_frames, in: {surface: surface}, with: {template: $template, template_surface: $template_surface, convention: $convention, side: $side, min_projection: $min_projection, max_condition: $max_condition}, out: [canonical, singular, gauge_angle, angle, second, handed, reliable]}

outputs:
  canonical:   {kind: field, kind_name: canonical frames, name: "{surface}_canonical_frames", on: surface.manifold.0, optional: true}
  singular:    {kind: selection, type: indices, name: "{surface}_frame_singularities", on: surface.manifold.0, optional: true}
  gauge_angle: {kind: field, kind_name: canonical frames, name: "{surface}_canonical_gauge_angle", on: surface.manifold.0, optional: true}
  angle:       {kind: field, kind_name: anatomical frames, name: "{surface}_anatomical_angle", on: surface.manifold.0}
  second:      {kind: field, kind_name: anatomical frames, name: "{surface}_anatomical_second", on: surface.manifold.0}
  handed:      {kind: field, kind_name: anatomical frames, name: "{surface}_anatomical_handed", on: surface.manifold.0}
  reliable:    {kind: selection, type: indices, name: "{surface}_anatomical_reliable", on: surface.manifold.0}
