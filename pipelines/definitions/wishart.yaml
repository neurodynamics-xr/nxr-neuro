# THE WISHART NULL OF THE BURSTS' LAGGED SHARE (two statistics of the recording): per burst, the analytic windows wholly inside it summed (its sensors' second moment Q), the lagged
# share |Im Q|^2 / |Q|^2, and the same share under a zero-lag Gaussian null of the burst's own covariance with dof = its duration x the band's effective bandwidth (the PSD's through
# the band's analytic gain): the p and the BH q; and the run's mean share against the null's. A SENSOR-level test: a burst beyond the null has lags beyond sampling noise, not a wave.
# The analytic windows come first (`nxr-neuro run crossspectrum_analytic`), named as `<name>_<band>_windows`; the bursts and the recording's Welch PSD too.
#
#   nxr-neuro run wishart --dataset <folder> --subject sub-01 --recording rest --windows rest_crossspectrum_alpha_windows --bursts "rest alpha bursts" --psd rest_psd_welch --band "[8, 12]"
pipeline: wishart
version: 1
description: per burst, the lagged share of its sensors' second moment against a zero-lag Wishart null
scope: subject

inputs:
  recording: {field: recording, each: true, where: {name: $recording}}
  bursts:    {selection: spans, manifold: recording.time, where: {name: $bursts}}
  psd:       {statistic: welch, where: {name: $psd}}

parameters:
  recording: {default: none, meaning: "the recording's name, or none: every recording of the subject, one run each", unit: "-"}
  windows: {default: null, meaning: "the band's analytic cross-spectrum series (<name>_<band>_windows)", unit: "-"}
  bursts: {default: null, meaning: "the bursts (a spans selection on the recording's time line)", unit: "-"}
  psd: {default: null, meaning: "the recording's Welch PSD (its bandwidth through the band's gain gives the dof)", unit: "-"}
  band: {default: null, meaning: "the band [lo, hi]", unit: "Hz"}
  shape: {default: morlet, meaning: "the band's analytic gain: morlet | meyer", unit: "-", choices: [morlet, meyer]}
  draws: {default: 1000, meaning: "the null's draws (at least 20)", unit: "-"}
  seed: {default: 0, meaning: "the draws' seed", unit: "-"}
  name: {default: "wishart.{bursts}", meaning: "the per-burst statistic's name; the run's is <name>.run", unit: "-"}

steps:
  before:
    - {step: wishart_null, in: {recording: recording, bursts: bursts, psd: psd}, with: {windows: $windows, band: $band, shape: $shape, draws: $draws, seed: $seed}, out: [per_burst, run]}

outputs:
  per_burst:
    kind: statistic
    name: $name
    of: recording
    axes: [{name: burst}, {name: test}]
  run:
    kind: statistic
    name: "$name.run"
    of: recording
    axes: [{name: test}]
