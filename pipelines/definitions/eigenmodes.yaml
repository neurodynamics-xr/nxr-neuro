# THE HODGE-DIRAC EIGENMODES OF A SURFACE: the patterns the cortex's own geometry allows, the basis every spatial band, flow and cycle pattern is read in (the instrument's spatial resolution: a
# mode is resolved only as far as the mesh and the solve go). Solved on the surface's INTRINSIC TRIANGULATION (made by its own definition `intrinsic`; the runner makes it first when it is not stored)
# by the split solve (the Laplace-Beltrami ladder d0^T *1 d0 with *0: exact modes; the 2-form ladder *2 d1 *1^-1 d1^T *2 with *2: coexact modes), cut at ONE lambda, the constants out. By default the
# REFERENCE method of nxr (`nxr.eigen.hodge_dirac.solve_hodge`) and Rheome (`rheome.eigen.hodge_dirac`); the methods used before are named options (shift, slice, normalize, the *1 floor), every
# option is in the provenance and the cache key. The triangulation's construction options (mollify, flip_eps) are the triangulation's own (`run intrinsic`).
#
# THE GRAPH (docs/specs/2026-11-17-eigenmodes-as-definition.md; the Studio's chain glueMesh -> intrinsicDelaunay -> hodgeDirac dec -> the two ladders):
#   surface + its intrinsic triangulation --[hodge_dirac: split solve]--> the eigenvalue line (mu: points), the eigenvalues, the kinds (a labelling of the line) and ONE eigenvectors
#   operator from the line to the triangulation's cells 0, 1 and 2 (each mode's mixed form).
# Stored (stem = `hodgeDirac`, or `hodgeDirac__<surface>` for a surface that is not the primary one):
#   <stem>                      the eigenvalue line: points, one per mode, coordinate mu = sqrt(lambda) > 0 ascending (the operator's eigenvalues)
#   <stem>_eigenvalues          field on the line: lambda = mu^2 (of_operator: the eigenvectors)
#   <stem>_kinds                selection (partition) of the line: exact (label 0) or coexact (label 2)
#   <stem>_eigenvectors         operator, the line (cell 0) -> the intrinsic triangulation (cell key 0+1+2) [(V + E + F) x K], float32: each mode's mixed form, rows 0-forms [0, V) (psi/sqrt2;
#                               0 for a coexact mode) · 1-forms [V, V+E) (d psi/(mu sqrt2) or *1^-1 d1^T *2 chi/(mu sqrt2)) · 2-forms [V+E, V+E+F) (chi/sqrt2; 0 for an exact mode), orthonormal under
#                               the stars *0, *1, *2; synthesis (the line -> the triangulation); the analysis is its D106 pair, not stored. A coexact mode's stream function at the vertices is not
#                               stored: a vertex reader derives it from the 2-form part (each vertex the mean over its faces of *2 chi/sqrt2, the reference's face-to-vertex operator)
#
# EIGENMODE FIRST (the maintainers' rule): the spatial bands read these modes; when a band needs eigenmodes that are not stored, the runner makes them first, as this run, with a message.
# A surface of TWO pieces (a cortex's hemispheres) is solved on its GLUED surface, a manifold made by its own definition (`run glue`) and NAMED here as the input. A two-piece surface given as it is,
# and three or more pieces, are refused. A solve stored in the earlier form (three operators _eigenvectors, _forms1, _forms2) is converted in place by `nxr-neuro migrate eigensolve`.
#
# What it cannot resolve: the modes are the discrete operator's on the mollified, Delaunay-flipped intrinsic triangulation; a mode above the mesh's resolution is not a property of the cortex, and
# the bridge of a glued surface is not cortex.
#
#   nxr-neuro run eigenmodes --dataset <folder> --subject sub-01 --surface cortex_pial [--modes 3000] [--replace]   (a cortex of two hemispheres: `run glue` first, then --surface cortex_pial_glued)
#
# ON A GRAPH (`--graph NAME`; spec docs/specs/2026-11-26-graph-manifold-and-time-cells.md, G1): a graph manifold (the fibre network `tile_network` stores) is a 1-complex, d0 = its incidence,
# *0 its vertices' weights (`<graph>_area`), *1 its edges' weights (`<graph>_conductance`), no 2-cells. Its Hodge-Dirac modes are the exact (gradient) modes of B^T *1 B psi = lambda *0 psi
# (the constants out) and the harmonic (cycle) modes, the kernel of B^T *1 (no coexact mode on a graph); ALL of them, one dense solve (a graph is small), stored in the same four classes
# (stem `hodgeDirac__<graph>`; the kinds exact 0, harmonic 1; the eigenvectors operator to the graph's cells 0+1, rows 0-forms then 1-forms). `connectome_flow` names them with
# `made_by`: they are solved once, when they are not stored.
#   nxr-neuro run eigenmodes --dataset <folder> --subject sub-01 --graph BUNDLE_tiles
pipeline: eigenmodes
version: 2
description: the Hodge-Dirac eigenmodes of a stored surface on its intrinsic triangulation, or of a stored graph under its node and edge weights, each mode's mixed form one column of one operator
scope: subject
one_of: [surface, graph]

inputs:
  surface: {manifold: surface, where: {name: $surface}, when: $surface, hint: "name the surface (--surface)"}
  intrinsic: {manifold: surface, where: {name: "${surface}_intrinsic"}, made_by: {pipeline: intrinsic, with: {surface: $surface}}, when: $surface, hint: "the surface's intrinsic triangulation (`run intrinsic`; made first when missing)"}
  graph: {manifold: graph, where: {name: $graph}, when: $graph, hint: "name the graph (--graph): a graph manifold (`nxr-neuro run tile_network` stores the fibre network)"}
  area: {field: any, where: {name: "${graph}_area"}, when: $graph, hint: "the graph's vertex weights (*0), stored with it"}
  conductance: {field: any, where: {name: "${graph}_conductance"}, when: $graph, hint: "the graph's edge weights (*1), stored with it"}

parameters:
  surface: {default: null, meaning: "the subject's stored surface to solve on, by name (or graph)", unit: "-"}
  graph: {default: null, meaning: "the subject's stored graph to solve on, by name (or surface): its vertex weights <graph>_area and edge weights <graph>_conductance", unit: "-"}
  null_tolerance: {default: 1.0e-10, meaning: "on a graph: an eigenvalue at most this fraction of the largest is a constant (one per connected component), left out", unit: "-"}
  modes: {default: 3000, meaning: "about this many positive modes are kept, half exact and half coexact", unit: modes}
  shift: {default: absolute, meaning: "how the shift-invert solve is shifted: absolute (one solve per ladder at sigma, the reference method) or relative (a ladder scaled to the spectrum)", unit: "-", choices: [absolute, relative]}
  sigma: {default: null, meaning: "the absolute shift (only with shift absolute); null: the reference method's -1e-3", unit: "1/m^2"}
  slice: {default: 0, meaning: "spectrum slicing: solve in windows of this many modes, each with its own shift; 0: one solve per ladder", unit: modes}
  normalize: {default: false, meaning: "make the modes orthonormal under the mass matrix after the solve (Cholesky whitening); the reference method does not", unit: "-"}
  dense_limit: {default: 3000, meaning: "the complete solve of a small mesh: when the surface has at most this many vertices and faces and modes asks for every mode (at least vertices + faces - 2), both ladders are solved dense and whole (every exact and coexact mode, no lambda cut; about 5 x dense_limit^2 doubles, 360 MB at 3000); larger surfaces, or fewer modes asked, the iterative solve; 0: never", unit: "vertices and faces"}
  star1_floor: {default: null, meaning: "raise the edge cotan weights (the 1-form Hodge star) that fall below this up to it; null: no floor (nxr's; Rheome used 1e-6)", unit: "-"}

steps:
  before:
    - step: operators.hodge_dirac
      in: {surface: surface, intrinsic: intrinsic}
      with: {modes: $modes, shift: $shift, sigma: $sigma, slice: $slice, normalize: $normalize, star1_floor: $star1_floor, dense_limit: $dense_limit}
      out: [modes, eigenvalues, kinds, eigenvectors]
      when: $surface
    - {node: meeg.graph_hodge_dirac, in: {graph: graph, area: area, conductance: conductance}, with: {null_tolerance: $null_tolerance}, out: [graph_modes, graph_eigenvalues, graph_kinds, graph_eigenvectors], when: $graph}

outputs:
  modes:        {kind: manifold, type: points, name: "{stem}", derived_from: surface.manifold.0, when: $surface}
  eigenvalues:  {kind: field, kind_name: eigenvalue, name: "{stem}_eigenvalues", on: modes, of_operator: eigenvectors, unit: "1/m^2", when: $surface}
  kinds:        {kind: selection, type: partition, name: "{stem}_kinds", on: modes, when: $surface}
  eigenvectors: {kind: operator, operator_kind: eigenvectors, name: "{stem}_eigenvectors", from: modes, to: intrinsic.manifold.0, when: $surface}
  graph_modes:        {kind: manifold, type: points, name: "hodgeDirac__{graph}", derived_from: graph.manifold.0, when: $graph}
  graph_eigenvalues:  {kind: field, kind_name: eigenvalue, name: "hodgeDirac__{graph}_eigenvalues", on: graph_modes, of_operator: graph_eigenvectors, unit: "1/m^2", when: $graph}
  graph_kinds:        {kind: selection, type: partition, name: "hodgeDirac__{graph}_kinds", on: graph_modes, when: $graph}
  graph_eigenvectors: {kind: operator, operator_kind: eigenvectors, name: "hodgeDirac__{graph}_eigenvectors", from: graph_modes, to: graph.manifold.0, when: $graph}
