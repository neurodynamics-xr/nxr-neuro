name: wheels

# The Python wheel (`pip install nxr-neuro`; bindings/python), built with cibuildwheel for Linux x86_64 (manylinux_2_28) and macOS arm64
# (macos-15, deployment target 13.3). The pytest suite (bindings/python/tests) runs on each built wheel, installed into a clean environment.
# - On a version tag (`v*`) and by hand (`workflow_dispatch`): build and test, upload the wheels as workflow artefacts.
# - On pull requests: only when bindings/python/**, the pipeline level's face (pipelines/face) or this workflow changes.
# Only the module target and the libraries it links are built (bindings/python/pyproject.toml: build.targets; no tests, no command line). No nightly.
# Nothing is published to PyPI: the artefacts are what a maintainer installs and checks.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]       # milestone pull requests only (develop -> main), when this binding changed
    paths:
      - "bindings/python/**"
      - "pipelines/include/nxr/pipelines/face.h"
      - "pipelines/src/face.cpp"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wheel:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: macos-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cibuildwheel
        run: python -m pip install --quiet cibuildwheel==4.3.5
      - name: Build the wheel and test it
        # the working directory is the project (copied whole into the manylinux container), bindings/python the package
        run: python -m cibuildwheel bindings/python --output-dir wheelhouse
      - name: What the wheel holds
        shell: bash
        run: |
          ls -l wheelhouse
          for w in wheelhouse/*.whl; do
            unzip -l "$w"
            unzip -l "$w" | grep -q 'licenses/LICENSE' || { echo "the wheel carries no LICENSE"; exit 1; }
            unzip -l "$w" | grep -q 'licenses/THIRD_PARTY_NOTICES.md' || { echo "the wheel carries no THIRD_PARTY_NOTICES.md"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error
