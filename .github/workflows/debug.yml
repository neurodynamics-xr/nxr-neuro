name: debug
on:
  push:
    branches: [ci/build-and-test]
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev zlib1g-dev libzstd-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target nxr-neuro-scenario test_crossings test_patches_pipeline test_vortex_cores_pipeline test_spatial_analytic
      - run: ctest --test-dir build --output-on-failure -R "store_identity|test_crossings|test_patches_pipeline|test_vortex_cores_pipeline|test_spatial_analytic"
