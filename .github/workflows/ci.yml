name: ci

# Build and test nxr-neuro.
# - Linux: every pull request, testing ONLY the libraries its changes touch (and what depends on them); documentation-only pull requests do
#   not run at all. Every push to main, every night and on demand: all tests, the slow ones included (the full suite).
# - macOS (macos-15, deployment target 13.3): pushes to main, tags and every night (all tests).
# Compiled objects are cached with ccache (keyed by branch, falling back to main), so a pull request recompiles only what it changed,
# the bundled dependencies (HDF5, matio, c-blosc, geometry-central) included.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore:          # documentation-only changes run no build and no tests
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "AUTHORS"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # a newer push cancels an older run only on pull requests: every run on main finishes (it fills the cache and runs the slow tests)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "true"
  # tests labelled `slow` (minutes each) run on main, nightly and on demand; pull requests run the rest
  CTEST_SELECT: ${{ github.event_name == 'pull_request' && '-LE slow' || '' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build tools and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache zlib1g-dev libzstd-dev pkg-config
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ github.ref_name }}-
            ccache-linux-main-
      - name: Fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Compiler cache statistics
        run: ccache --show-stats --verbose | head -20
      - name: "Select tests (pull requests: only the libraries the changes touch)"
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})
          labels=""
          add() { for l in "$@"; do case " $labels " in *" $l "*) ;; *) labels="$labels $l";; esac; done; }
          all=0
          for f in $changed; do
            case "$f" in
              compute/*)          add compute pipelines pipelines_graph cli ;;
              meeg/*)             add meeg pipelines cli ;;
              io/formats/*)       add io_formats io pipelines cli ;;
              io/*)               add io pipelines cli ;;
              pipelines/graph/*)  add pipelines_graph pipelines cli ;;
              pipelines/*)        add pipelines cli ;;
              cli/*)              add cli ;;
              bindings/*|docs/*|*.md) ;;
              tools/gen_record_rows.py) add io pipelines cli ;;   # the one tool a test reads (io's `records_rows_current` runs it)
              tools/*) ;;                           # the other tools are developer scripts no test reads: the layering checks only
              .github/workflows/ci.yml) all=1 ;;    # this workflow itself: everything
              .github/*) ;;                         # the other workflows (bindings, release) and GitHub settings: no C++ tests
              *)                  all=1 ;;          # top-level CMake, cmake/, CI: everything
            esac
          done
          if [ "$all" = 1 ]; then echo "CTEST_SCOPE=" >> "$GITHUB_ENV"; echo "scope: all (a shared file changed)";
          elif [ -z "$labels" ]; then echo "CTEST_SCOPE=-R ^layering_" >> "$GITHUB_ENV"; echo "scope: the layering checks only";
          else re=$(echo $labels | tr ' ' '|'); echo "CTEST_SCOPE=-L ^(${re})\$" >> "$GITHUB_ENV"; echo "scope: $labels"; fi
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure -j 4 $CTEST_SELECT $CTEST_SCOPE
          ctest --test-dir build --output-on-failure -R '^layering_'

  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-15            # macos-14 jobs are cancelled before they start for this organisation
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"   # std::to_chars for floating point
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build tools and system libraries
        run: brew install ninja ccache zstd pkg-config
      - name: System SQLite version (for the record; the build uses the pinned amalgamation)
        run: /usr/bin/sqlite3 --version
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ github.ref_name }}-
            ccache-macos-main-
      - name: Fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 3
